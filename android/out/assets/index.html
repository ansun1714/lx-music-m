/* ===== styles.css ===== */
/* LX Music v1.9.2 界面样式
 * 尺寸口径：HEADER_HEIGHT=42、LIST_ITEM_HEIGHT=54、抽屉 70%/≤300px、
 * PlayerBar 按钮 46×46 / 图标 24px、搜索栏 38px。
 * 颜色全部取自 themes.js 生成的 --c-* 变量（与原版派生算法一致）。
 */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; color: var(--c-font, #424242);
  background: var(--c-app-background, #f2faf6);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
.hidden { display: none !important; }
.lx-icon { font-size: 20px; color: inherit; }

.app { position: relative; display: flex; flex-direction: column; height: 100%;
  background: var(--c-app-background); }
.page { display: flex; flex-direction: column; flex: 1; min-height: 0;
  background: var(--c-main-background); }

/* ---------------------------------------------------------------- 抽屉 */
.drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 40;
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer-mask.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 41;
  width: 70%; max-width: 300px; display: flex; flex-direction: column;
  background: var(--c-content-background, #fff);
  transform: translateX(-100%); transition: transform .22s ease;
  box-shadow: 4px 0 24px rgba(0,0,0,.16); }
.drawer.open { transform: none; }
.drawer-head { padding: 40px 16px 50px; display: flex; align-items: center; justify-content: center;
  background: var(--c-primary-light-700-alpha-500, #daeee4);
  color: var(--c-primary-dark-100-alpha-300, #459e70); }
.drawer-head .lx-icon { font-size: 28px; }
.drawer-head span { margin-left: 16px; font-size: 28px; font-weight: 500; }
.drawer-menus { flex: 1; overflow-y: auto; padding: 10px 0; }
.nav-item { display: flex; align-items: center; width: 100%; padding: 13px 25px;
  color: var(--c-font); text-align: left; }
.nav-item .ni-icon { width: 24px; text-align: center; color: var(--c-font-label); }
.nav-item .ni-icon .lx-icon { font-size: 20px; }
.nav-item .ni-text { padding-left: 20px; font-size: 15px; }
.nav-item.active { background: var(--c-primary-background, rgba(182,222,201,.3)); }
.nav-item.active .ni-icon { color: var(--c-primary-font-active); }
.nav-item.active .ni-text { color: var(--c-primary-font, var(--c-primary)); font-weight: 600; }
.nav-badge { margin-left: auto; font-size: 11px; min-width: 18px; height: 18px; line-height: 18px;
  text-align: center; border-radius: 9px; background: var(--c-badge-primary, #4daf7c); color: #fff; }
.drawer-foot { border-top: 1px solid var(--c-border-background); padding: 6px 0 18px; }

/* ---------------------------------------------------------------- Header */
.header { height: 42px; min-height: 42px; display: flex; align-items: center;
  padding: 0 5px; z-index: 10; background: var(--c-main-background); }
.h-btn { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
  color: var(--c-font); }
.h-btn .lx-icon { font-size: 18px; }
.h-title { flex: 1; height: 42px; text-align: left; padding-left: 14px; font-size: 18px;
  color: var(--c-font); }
.h-extra { display: flex; align-items: center; gap: 4px; }
.h-extra .lx-icon { font-size: 18px; }
.type-tabs { display: flex; align-items: center; margin-right: 6px; }
.type-tabs button { padding: 5px 10px; font-size: 13px; color: var(--c-font-label); border-radius: 4px; }
.type-tabs button.on { color: var(--c-primary-font, var(--c-primary)); background: var(--c-button-background); }

/* ---------------------------------------------------------------- 主区 */
.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  background: var(--c-main-background); -webkit-overflow-scrolling: touch; }
.pad { padding: 10px 12px 24px; }

/* 搜索页 */
.searchbar { height: 38px; display: flex; align-items: center; padding-right: 10px;
  border-bottom: 1px solid var(--c-border-background); z-index: 2; }
.src-select { position: relative; height: 100%; display: flex; align-items: center;
  padding: 0 10px; gap: 3px; color: var(--c-font); font-size: 14px; }
.src-select .lx-icon { font-size: 12px; color: var(--c-font-label); }
.search-input { flex: 1; height: 30px; border: 0; outline: 0; background: transparent;
  border-bottom: 1px solid var(--c-primary-alpha-300, rgba(77,175,124,.7)); padding: 0 6px; font-size: 14px; }
.search-go { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  color: var(--c-primary-font, var(--c-primary)); }
.tip-section { padding: 14px 14px 6px; }
.tip-title { font-size: 13px; color: var(--c-font-label); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 14px; font-size: 13px;
  background: var(--c-button-background, rgba(182,222,201,.3)); color: var(--c-font); }
.welcome { text-align: center; color: var(--c-font-label); padding: 36px 0 18px; font-size: 15px; }
.sec-head { display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 6px; }
.sec-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.sec-head .lx-icon { font-size: 16px; color: var(--c-font-label); }

/* 歌曲列表：行高 54 */
.music-list { width: 100%; }
.m-row { height: 54px; display: flex; align-items: center; padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--c-border-background, rgba(0,0,0,.06)); }
.m-row:active { background: var(--c-button-background); }
.m-row.playing .m-name { color: var(--c-primary-font, var(--c-primary)); }
.m-idx { width: 26px; flex: none; text-align: center; color: var(--c-font-label); font-size: 12px; }
.m-main { flex: 1; min-width: 0; }
.m-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-sub { font-size: 11px; color: var(--c-font-label); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-meta { flex: none; font-size: 11px; color: var(--c-font-label); padding: 0 8px; text-align: right; }
.m-src { flex: none; font-size: 10px; padding: 2px 5px; border-radius: 3px;
  background: var(--c-button-background); color: var(--c-primary-font, var(--c-primary)); }
.m-act { flex: none; width: 30px; height: 40px; display: flex; align-items: center; justify-content: center;
  color: var(--c-font-label); }
.m-act .lx-icon { font-size: 17px; }
.list-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid var(--c-list-header-border-bottom, rgba(77,175,124,.1)); }
.btn { padding: 6px 12px; border-radius: 5px; font-size: 13px;
  background: var(--c-button-background); color: var(--c-font); }
.btn.primary { background: var(--c-primary); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--c-border-background); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.chk { width: 18px; height: 18px; flex: none; }

/* 卡片网格（歌单 / 榜单） */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
.card { border-radius: 8px; overflow: hidden; background: var(--c-content-background);
  border: 1px solid var(--c-border-background); }
.card-cover { height: 92px; display: flex; align-items: flex-end; padding: 10px;
  color: #fff; font-size: 16px; font-weight: 600;
  background: linear-gradient(135deg, var(--card-color, #4daf7c), rgba(0,0,0,.18)); }
.card-body { padding: 8px 10px 10px; }
.card-name { font-size: 13px; line-height: 1.35; height: 36px; overflow: hidden; }
.card-sub { font-size: 11px; color: var(--c-font-label); margin-top: 5px; }
.tabs-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 9px 12px; white-space: nowrap; }
.tabs-scroll button { padding: 5px 11px; border-radius: 13px; font-size: 12px;
  background: var(--c-button-background); color: var(--c-font-label); }
.tabs-scroll button.on { background: var(--c-primary); color: #fff; }

/* 我的列表：左右布局 */
.mylist-layout { display: flex; min-height: 100%; }
.list-nav { width: 118px; flex: none; border-right: 1px solid var(--c-border-background); }
.list-nav button { display: block; width: 100%; text-align: left; padding: 12px 10px;
  font-size: 13px; color: var(--c-font-label); border-left: 3px solid transparent; }
.list-nav button.on { color: var(--c-primary-font, var(--c-primary));
  border-left-color: var(--c-primary); background: var(--c-button-background); }
.list-content { flex: 1; min-width: 0; }
.multi-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px;
  background: var(--c-button-background); flex-wrap: wrap; }

/* 设置 */
.set-group { padding: 0 0 6px; }
.set-group-title { padding: 14px 14px 7px; font-size: 12px; color: var(--c-primary-font, var(--c-primary)); }
.set-row { display: flex; align-items: center; min-height: 50px; padding: 8px 14px;
  border-bottom: 1px solid var(--c-border-background); gap: 10px; }
.set-row .sr-main { flex: 1; min-width: 0; }
.set-row .sr-name { font-size: 14px; }
.set-row .sr-desc { font-size: 11px; color: var(--c-font-label); margin-top: 3px; }
.set-row select, .set-row input[type=number], .set-row input[type=text] {
  border: 1px solid var(--c-border-background); background: var(--c-content-background);
  border-radius: 4px; padding: 5px 7px; font-size: 13px; max-width: 130px; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; border-radius: 11px; background: var(--c-200, #d3d3d3);
  transition: .2s; }
.switch i:before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
  border-radius: 50%; background: #fff; transition: .2s; }
.switch input:checked + i { background: var(--c-primary); }
.switch input:checked + i:before { transform: translateX(18px); }
.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 14px 14px; }
.theme-dot { height: 46px; border-radius: 6px; border: 2px solid transparent;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px;
  font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.theme-dot.on { border-color: var(--c-font); }

/* 下载 */
.dl-stats { display: flex; gap: 8px; padding: 12px; }
.dl-stat { flex: 1; text-align: center; padding: 10px 4px; border-radius: 7px;
  background: var(--c-button-background); }
.dl-stat b { display: block; font-size: 19px; color: var(--c-primary-font, var(--c-primary)); }
.dl-stat span { font-size: 11px; color: var(--c-font-label); }
.dl-item { padding: 10px 14px; border-bottom: 1px solid var(--c-border-background); }
.dl-head { display: flex; align-items: center; gap: 8px; }
.dl-name { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-state { font-size: 11px; color: var(--c-font-label); }
.dl-bar { height: 5px; border-radius: 3px; background: var(--c-100, #e9e9e9); margin: 8px 0 6px; overflow: hidden; }
.dl-bar i { display: block; height: 100%; background: var(--c-primary); transition: width .15s; }
.dl-meta { font-size: 11px; color: var(--c-font-label); display: flex; justify-content: space-between; }
.dl-acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.dl-acts button { font-size: 12px; padding: 4px 10px; border-radius: 4px;
  background: var(--c-button-background); }

/* PlayerBar */
.playerbar { position: relative; flex: none; min-height: 56px; display: flex; align-items: center;
  padding: 5px 5px 5px 5px; background: var(--c-content-background, #fff);
  border-top-left-radius: 6px; border-top-right-radius: 6px;
  box-shadow: 0 -2px 10px rgba(0,0,0,.10); z-index: 12; }
.pb-progress { position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: var(--c-border-background); }
.pb-progress i { display: block; height: 100%; width: 0; background: var(--c-primary); }
.pb-pic { width: 46px; height: 46px; flex: none; border-radius: 4px; display: flex;
  align-items: center; justify-content: center; color: #fff;
  background: linear-gradient(135deg, var(--c-primary), var(--c-primary-dark-300, #2c7a53)); }
.pb-pic .lx-icon { font-size: 24px; }
.pb-center { flex: 1; min-width: 0; padding-left: 5px; }
.pb-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-info { font-size: 11px; color: var(--c-font-label); margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-ctrl { display: flex; align-items: center; flex: none; padding: 0 5px; }
.pb-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--c-button-font, var(--c-primary)); }
.pb-btn .lx-icon { font-size: 24px; }

/* 全屏页面 / 播放详情 / 评论 */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--c-main-background);
  display: flex; flex-direction: column; }
.ov-head { height: 48px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 12px; border-bottom: 1px solid var(--c-border-background); }
.ov-head .lx-icon { font-size: 20px; }
.ov-head h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.ov-body { flex: 1; min-height: 0; overflow-y: auto; }
.detail-cover { width: 62%; max-width: 260px; aspect-ratio: 1; margin: 22px auto 16px;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #fff; background: linear-gradient(135deg, var(--c-primary), var(--c-primary-dark-400, #256b48));
  box-shadow: 0 8px 26px rgba(0,0,0,.18); }
.detail-cover .lx-icon { font-size: 76px; }
.detail-title { text-align: center; font-size: 18px; }
.detail-sub { text-align: center; font-size: 12px; color: var(--c-font-label); margin-top: 5px; }
.lyric { padding: 18px 20px 30px; text-align: center; }
.lyric p { margin: 11px 0; font-size: 14px; color: var(--c-font-label); transition: .2s; }
.lyric p.on { color: var(--c-primary-font, var(--c-primary)); font-size: 16px; font-weight: 600; }
.player-ctl { flex: none; padding: 8px 18px 24px; }
.time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--c-font-label); }
.seek { width: 100%; height: 4px; margin: 8px 0 12px; accent-color: var(--c-primary); }
.ctl-row { display: flex; align-items: center; justify-content: space-around; }
.ctl-row button { width: 48px; height: 48px; color: var(--c-primary-font, var(--c-primary)); }
.ctl-row .lx-icon { font-size: 24px; }
.ctl-row .big .lx-icon { font-size: 38px; }
.cm-item { padding: 12px 14px; border-bottom: 1px solid var(--c-border-background); }
.cm-user { font-size: 13px; color: var(--c-primary-font, var(--c-primary)); }
.cm-time { font-size: 11px; color: var(--c-font-label); margin-left: 8px; }
.cm-text { font-size: 14px; margin: 7px 0; line-height: 1.5; }
.cm-acts { font-size: 12px; color: var(--c-font-label); display: flex; gap: 16px; }

/* 弹层 / 菜单 / Toast */
.modal-root { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.42);
  display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal { width: 100%; max-width: 320px; border-radius: 10px; padding: 18px;
  background: var(--c-content-background, #fff); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
.modal h3 { margin: 0 0 10px; font-size: 16px; }
.modal p { font-size: 13px; color: var(--c-font-label); line-height: 1.6; }
.modal input, .modal select { width: 100%; padding: 8px; margin: 8px 0;
  border: 1px solid var(--c-border-background); border-radius: 5px; background: transparent; }
.modal-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.ctx-menu { position: fixed; z-index: 70; min-width: 160px; padding: 5px 0; border-radius: 7px;
  background: var(--c-content-background, #fff); box-shadow: 0 6px 24px rgba(0,0,0,.22); }
.ctx-menu button { display: block; width: 100%; text-align: left; padding: 11px 16px; font-size: 14px; }
.ctx-menu button:active { background: var(--c-button-background); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 80;
  max-width: 84%; padding: 9px 16px; border-radius: 18px; font-size: 13px;
  background: rgba(30,30,30,.86); color: #fff; }
.empty { text-align: center; color: var(--c-font-label); padding: 46px 20px; font-size: 13px; }
.empty .lx-icon { display: block; font-size: 40px; margin-bottom: 12px; opacity: .5; }

/* 深色主题微调 */
[data-dark="1"] .pb-pic, [data-dark="1"] .card-cover { filter: brightness(.85); }
[data-dark="1"] .chip, [data-dark="1"] .btn { color: var(--c-font); }

@media (min-width: 760px) {
  .app { max-width: 520px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,.12); }
  .drawer { left: max(0px, calc(50% - 260px)); }
}

</style>

<body>

<div class="app" id="app">

  <!-- 左侧抽屉：宽 70%，最大 300px -->
  <div class="drawer-mask" id="drawerMask" data-act="close-drawer"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <i class="lx-icon lx-logo"></i><span>LX Music</span>
    </div>
    <nav class="drawer-menus" id="navMenus"></nav>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div class="page">
    <!-- 顶部 Header：42px + 状态栏 -->
    <header class="header" id="header">
      <button class="h-btn" data-act="drawer" aria-label="菜单"><i class="lx-icon lx-menu"></i></button>
      <button class="h-title" data-act="drawer" id="headerTitle">搜索</button>
      <div class="h-extra" id="headerExtra"></div>
    </header>

    <!-- 主区：可横向滑动的 6 个视图 -->
    <main class="view" id="view"></main>

    <!-- 底部播放条 -->
    <div class="playerbar" id="playerBar" data-act="open-detail">
      <div class="pb-progress"><i id="pbProgressFill"></i></div>
      <div class="pb-pic" id="pbPic"><i class="lx-icon lx-album"></i></div>
      <div class="pb-center">
        <div class="pb-title" id="pbTitle">LX Music</div>
        <div class="pb-info" id="pbInfo">未播放</div>
      </div>
      <div class="pb-ctrl">
        <button class="pb-btn" data-act="prev" aria-label="上一首"><i class="lx-icon lx-prevMusic"></i></button>
        <button class="pb-btn" data-act="toggle" id="pbToggle" aria-label="播放"><i class="lx-icon lx-play"></i></button>
        <button class="pb-btn" data-act="next" aria-label="下一首"><i class="lx-icon lx-nextMusic"></i></button>
      </div>
    </div>
  </div>

  <!-- 全屏页面 / 弹层 / 菜单 / Toast -->
  <div class="overlay hidden" id="overlay"></div>
  <div class="modal-root hidden" id="modalRoot"></div>
  <div class="ctx-menu hidden" id="contextMenu"></div>
  <div class="toast hidden" id="toast"></div>

<script>/* ===== themes.js ===== */
/* LX Music v1.9.2 主题系统
 * 移植自开源项目 src/theme/themes/{colorUtils,utils,themes/index}.js|.ts
 * 用同一套 primary 派生 232 个 c-primary-* 变量 + buildActiveThemeColors 别名，
 * 因此 16 套主题的每一处配色都与原版一致。
 */
(function () {
  'use strict';

  function parse(c) {
    var m = String(c).match(/-?[\d.]+/g);
    return m ? { r: +m[0], g: +m[1], b: +m[2], a: m.length > 3 ? +m[3] : null } : { r: 0, g: 0, b: 0, a: null };
  }
  function shade(p, c0) {
    var c = parse(c0), n = p < 0, t = n ? 0 : 255 * p, P = n ? 1 + p : 1 - p;
    var rgb = 'rgb' + (c.a == null ? '(' : 'a(') + Math.round(c.r * P + t) + ',' +
      Math.round(c.g * P + t) + ',' + Math.round(c.b * P + t);
    return rgb + (c.a == null ? ')' : ',' + c.a + ')');
  }
  function alphaShade(p, color) {
    var c = parse(color), n = p < 0, a;
    if (c.a != null) {
      a = c.a - (n ? (1 - c.a) * p : c.a * p);
      a = n ? Math.max(0, a) : Math.min(1, a);
    } else a = Math.min(1, 1 - p);
    return 'rgba(' + parseInt(c.r, 10) + ', ' + parseInt(c.g, 10) + ', ' +
      parseInt(c.b, 10) + ', ' + a.toFixed(2) + ')';
  }
  function pad3(n) { return ('000' + n).slice(-3); }

  function createThemeColors(primary, font, isDark) {
    var colors = { 'c-primary': primary }, pre, i, j;
    pre = primary;
    for (i = 1; i < 11; i++) {
      pre = shade(isDark ? 0.2 : -0.1, pre);
      colors['c-primary-dark-' + i * 100] = pre;
      for (j = 1; j < 10; j++) {
        colors['c-primary-dark-' + i * 100 + '-alpha-' + j * 100] = alphaShade(0.1 * j, pre);
        colors['c-primary-alpha-' + j * 100] = alphaShade(0.1 * j, primary);
      }
    }
    pre = primary;
    for (i = 1; i < 10; i++) {
      pre = shade(isDark ? -0.1 : 0.2, pre);
      colors['c-primary-light-' + i * 100] = pre;
      for (j = 1; j < 10; j++)
        colors['c-primary-light-' + i * 100 + '-alpha-' + j * 100] = alphaShade(0.1 * j, pre);
    }
    pre = shade(isDark ? -0.35 : 1, pre);
    colors['c-primary-light-1000'] = pre;
    for (j = 1; j < 10; j++)
      colors['c-primary-light-1000-alpha-' + j * 100] = alphaShade(0.1 * j, pre);
    colors['c-theme'] = isDark ? colors['c-primary-light-900'] : primary;

    var f = font || (isDark ? 'rgb(229, 229, 229)' : 'rgb(33, 33, 33)');
    colors['c-1000'] = f;
    if (isDark) {
      pre = f;
      for (i = 1; i < 21; i++) { pre = shade(-0.05, pre); colors['c-' + pad3(1000 - 50 * i)] = pre; }
    } else {
      for (i = 1; i < 21; i++) colors['c-' + pad3(1000 - 50 * i)] = shade(0.05 * i, f);
    }
    return colors;
  }

  // id / 名称 / primary / 是否深色 —— 全部取自 createThemes.js

  var ALIASES = {

  function downloadListHtml() {

    return jobs.map(function (j) {
      var stateText = { done: '已完成', running: '下载中', waiting: '等待中', paused: '已暂停',
        cancelled: '已取消', error: '失败' }[j.state] || j.state;
      var acts = '';
      if (j.state === 'running' || j.state === 'waiting') acts += '<button data-act="dl-pause" data-id="' + j.id + '">暂停</button>';
      if (j.state === 'paused') acts += '<button data-act="dl-resume" data-id="' + j.id + '">继续</button>';
      if (j.state === 'cancelled' || j.state === 'error') acts += '<button data-act="dl-retry" data-id="' + j.id + '">重试</button>';

        '<button class="btn sm" data-act="log-clear">清理</button></div>' +
        '<div class="set-row"><div class="sr-main"><div class="sr-name">已下载文件</div>' +
        '<div class="sr-desc">' + DL.stats().done + ' 个 · ' + DL.stats().sizeText + '</div></div>' +
        '<button class="btn sm" data-act="dl-clear-finished">清理已完成</button></div>' +
        '<div class="set-group-title">错误日志</div><div style="padding:0 14px 20px;font-size:12px;color:var(--c-font-label)">' +
        (S.errorLog.length ? S.errorLog.map(esc).join('<br>') : '暂无日志') + '</div></div></div>';
    }
    o.innerHTML = '<div class="ov-head"><button data-act="close-overlay">' + icon('chevron-left') + '</button>' +
      '<h2>' + esc(title) + '</h2></div>' + body;
    o.classList.remove('hidden');
  }

  // ---------------------------------------------------------------- 播放
  function playFrom(id, ids) {
    var tr = D.byId(id);
    if (!tr) return;
    var local = DL.getPlayableUrl(id);
    // 离线拦截必须早于队列改写，否则被拒绝的曲目仍会顶替当前播放项（播放器状态与提示不一致）
    if (S.settings.offline && !local) { toast(t('offline_tip', '离线模式下该曲目未下载')); return; }
    var list = (ids && ids.length ? ids : contextIds()).slice();
    var i = list.indexOf(id);
    if (i < 0) { list.unshift(id); i = 0; }
    S.queue = list; S.index = i;
    engine.load(tr, local ? { kind: 'downloaded', localUrl: local } : null).then(function () {
      if (S.settings.savePlayTime && S.progress[id] && S.progress[id] > 2 && S.progress[id] < tr.duration - 3)
        engine.seek(S.progress[id]);
      engine.setRate(S.rate);
      engine.setVolume(S.volume);
      engine.play();
      S.playing = true;
      var l = S.lists.filter(function (x) { return x.id === 'default'; })[0];
      if (l && l.trackIds.indexOf(id) < 0) l.trackIds.push(id);
      save(); renderPlayer(); renderView();
    });
  }
  function togglePlay() {
    if (!S.queue.length) { playFrom(D.tracks[0].id, D.tracks.slice(0, 20).map(function (x) { return x.id; })); return; }
    if (S.playing) { engine.pause(); S.playing = false; }
    else { engine.play(); S.playing = true; }
    renderPlayer();
  }
  function nextTrack(auto) {
    if (!S.queue.length) return;
    var n = S.index;
    if (S.mode === 'singleLoop' && auto) n = S.index;
    else if (S.mode === 'random') n = Math.floor(Math.random() * S.queue.length);
    else n = (S.index + 1) % S.queue.length;
    if (n === S.queue.length - 1 && S.mode === 'list' && auto) { engine.pause(); S.playing = false; renderPlayer(); return; }
    S.index = n;
    playFrom(S.queue[n], S.queue);
  }
  function prevTrack() {
    if (!S.queue.length) return;
    S.index = (S.index - 1 + S.queue.length) % S.queue.length;
    playFrom(S.queue[S.index], S.queue);
  }
  function cycleMode() {
    S.mode = MODES[(MODES.indexOf(S.mode) + 1) % MODES.length];
    save();
    toast({ listLoop: '列表循环', random: '随机播放', list: '顺序播放', singleLoop: '单曲循环' }[S.mode]);
    renderOverlay();
  }
  function renderPlayer() {
    var tr = currentTrack();
    var title = $('pbTitle'), info = $('pbInfo'), tog = $('pbToggle');
    if (title) title.textContent = tr ? tr.name : 'LX Music';
    if (info) info.textContent = tr ? tr.singer + ' · ' + tr.album : t('player__end', '播放完毕');
    if (tog) tog.innerHTML = icon(S.playing ? 'pause' : 'play');
    var dt = $('detailToggle'); if (dt) dt.innerHTML = icon(S.playing ? 'pause' : 'play');
  }

  // ---------------------------------------------------------------- 渲染入口
  var VIEWS = {
    nav_search: viewSearch, nav_songlist: viewSongList, nav_top: viewLeaderboard,
    nav_love: viewMyList, nav_download: viewDownload, nav_setting: viewSetting
  };
  function renderView() {
    var el = $('view'); if (!el) return;
    el.innerHTML = (VIEWS[S.nav] || viewSearch)();
    renderHeader();
  }
  function render() { renderNav(); renderView(); renderPlayer(); }

  // ---------------------------------------------------------------- 事件
  function listTracksForDownload() {
    if (S.selected.length) return S.selected.map(D.byId).filter(Boolean);
    if (S.nav === 'nav_search' && S.search.results) return S.search.results.slice(0, 20);
    var l = S.lists.filter(function (x) { return x.id === S.activeList; })[0];
    if (l && l.trackIds.length) return l.trackIds.map(D.byId).filter(Boolean);
    var cur = currentTrack();
    return cur ? [cur] : D.tracks.slice(0, 1);
  }
  function addToList(ids) {
    modal(t('add_to', '添加到...'), S.lists.map(function (l) {
      return '<button class="set-row" style="width:100%;text-align:left" data-act="add-to-list" data-id="' +
        esc(l.id) + '" data-track="' + esc(ids.join(',')) + '"><div class="sr-main"><div class="sr-name">' +
        esc(l.name) + '</div></div>' + icon('chevron-right') + '</button>';
    }).join(''), [{ text: t('cancel', '取消'), act: 'close-modal' }]);
  }
  function trackMenu(id, x, y) {
    menu([
      { text: t('play', '播放'), act: 'menu-play', id: id },
      { text: t('collect', '收藏'), act: 'menu-fav', id: id },
      { text: t('play_later', '稍后播放'), act: 'menu-later', id: id },
      { text: t('download', '下载'), act: 'menu-download', id: id },
      { text: t('song_detail', '歌曲详情'), act: 'menu-detail', id: id },
      { text: t('comment', '评论'), act: 'menu-comment', id: id },
      { text: t('add_to', '添加到...'), act: 'menu-add', id: id }
    ], x, y);
  }

  function onClick(e) {
    var node = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!node) { closeMenu(); closeModalIfBackdrop(e); return; }
    var a = node.dataset.act, id = node.dataset.id, val = node.dataset.val;
    if (a !== 'track-menu') closeMenu();

    switch (a) {
      case 'drawer': openDrawer(true); return;
      case 'close-drawer': openDrawer(false); return;
      case 'nav': S.nav = id; S.multi = false; S.selected = []; openDrawer(false); save(); render(); return;
      case 'back-home': toast(t('back_home', '返回桌面')); openDrawer(false); return;
      case 'exit-app': modal(t('exit_app_tip', '确定要退出应用吗？'), '', [
        { text: t('cancel', '取消'), act: 'close-modal' },
        { text: t('confirm', '确定'), act: 'do-exit', primary: true }]); return;
      case 'do-exit': closeModal(); openDrawer(false); toast('已退出（WebView 环境保留页面）'); return;

      // 搜索
      case 'search-type': S.search.type = id; renderHeader(); renderView(); return;
      case 'source-menu': menu([{ id: 'all', text: '聚合搜索' }].concat(D.SOURCES.map(function (s) {
        return { id: s.id, text: s.name, act: 'set-source' };
      })).map(function (m) { m.act = m.act || 'set-source'; return m; }), 20, 100); return;
      case 'set-source': S.search.source = id; closeMenu(); renderView(); return;
      case 'do-search': { var inp = $('searchInput'); doSearch(inp ? inp.value : S.search.text); return; }
      case 'quick-search': doSearch(id); return;

      // 列表与播放
      case 'play-row': playFrom(id); return;
      case 'play-all': case 'play-list': case 'play-board': case 'play-all-songlist':
        playFrom(D.tracks[0].id, contextIds()); return;
      case 'toggle': togglePlay(); return;
      case 'next': nextTrack(false); return;
      case 'prev': prevTrack(); return;
      case 'mode': cycleMode(); return;
      case 'rate': {
        var rates = [0.75, 1, 1.25, 1.5, 2];
        S.rate = rates[(rates.indexOf(S.rate) + 1) % rates.length];
        S.settings.playbackRate = S.rate; engine.setRate(S.rate); save();
        toast(t('play_detail_setting_playback_rate', '播放速率') + ' ×' + S.rate); return;
      }
      case 'multi-toggle': S.multi = !S.multi; S.selected = []; renderView(); return;
      case 'multi-exit': S.multi = false; S.selected = []; renderView(); return;
      case 'select': {
        var i = S.selected.indexOf(id);
        if (i >= 0) S.selected.splice(i, 1); else S.selected.push(id);
        renderView(); return;
      }
      case 'select-all': S.selected = contextIds().slice(); renderView(); return;
      case 'download-selected': case 'dl-add-current': {
        var n = DL.enqueue(listTracksForDownload(), DL.opts.quality);
        toast(n ? t('download_added', '已加入下载队列') + ' ' + n : t('download_exists', '任务已存在'));
        if (S.nav !== 'nav_download') { S.nav = 'nav_download'; render(); }
        return;
      }
      case 'add-selected': addToList(S.selected.slice()); return;
      case 'add-to-list': {
        var l = S.lists.filter(function (x) { return x.id === id; })[0];
        (node.dataset.track || '').split(',').forEach(function (tid) {
          if (tid && l && l.trackIds.indexOf(tid) < 0) l.trackIds.push(tid);
        });
        closeModal(); save(); renderView(); toast(t('list_add_title_last', '添加成功')); return;
      }
      case 'switch-list': S.activeList = id; S.multi = false; S.selected = []; save(); renderView(); return;
      case 'create-list': modal(t('list_create', '新建列表'),
        '<input id="newListName" placeholder="' + esc(t('list_create_input_placeholder', '你想起啥名...')) + '">',
        [{ text: t('cancel', '取消'), act: 'close-modal' },
         { text: t('confirm', '确定'), act: 'do-create-list', primary: true }]); return;
      case 'do-create-list': {
        var ni = $('newListName'), name = ni && ni.value.trim();
        if (name) { S.lists.push({ id: 'user_' + Date.now(), name: name, trackIds: [] }); save(); renderView(); }
        closeModal(); return;
      }
      case 'list-menu': menu([
        { text: t('list_add_title_first_move', '导入歌单'), act: 'import-list' },
        { text: t('setting_backup', '备份与恢复'), act: 'open-panel', id: 'backup' },
        { text: t('list_create', '新建列表'), act: 'create-list' }
      ], 200, 120); return;
      case 'track-menu': trackMenu(id, e.clientX, e.clientY); return;
      case 'menu-play': playFrom(id); return;
      case 'menu-fav': {
        var lv = S.lists.filter(function (x) { return x.id === 'love'; })[0];
        if (lv.trackIds.indexOf(id) < 0) lv.trackIds.push(id);
        save(); toast(t('collect_success', '收藏成功')); return;
      }
      case 'menu-later': {
        var pl = S.lists.filter(function (x) { return x.id === 'play_later'; })[0];
        if (pl.trackIds.indexOf(id) < 0) pl.trackIds.push(id);
        save(); toast(t('play_later', '稍后播放')); return;
      }
      case 'menu-download': DL.enqueue([D.byId(id)], DL.opts.quality);
        toast(t('download_added', '已加入下载队列')); return;
      case 'menu-detail': case 'open-detail': openOverlay('detail', id || (currentTrack() || D.tracks[0]).id); return;
      case 'menu-comment': openOverlay('comment', id); return;
      case 'menu-add': addToList([id]); return;
      case 'open-songlist': openOverlay('songlist', id); return;
      case 'open-board': S.boardId = id; save(); renderView(); return;
      case 'board-menu': menu(D.BOARDS.slice(0, 12).map(function (b) {
        return { text: b.name, act: 'set-board', id: b.id };
      }), 120, 100); return;
      case 'set-board': S.boardId = id; closeMenu(); renderView(); return;
      case 'sl-tag': S.songlistTag = id; save(); renderView(); return;

      // 设置
      case 'set-theme': S.theme = id; T.apply(id); save(); render(); toast(T.list.filter(function (x) { return x.id === id; })[0].name); return;
      case 'set-bool': S.settings[id] = !!node.checked; save(); applySettings(); return;
      case 'set-select': S.settings[id] = node.value; save(); applySettings(); return;
      case 'set-num': S.settings[id] = Number(node.value); save(); applySettings(); return;
      case 'open-panel': openOverlay(id); return;
      case 'close-overlay': closeOverlay(); return;
      case 'cm-tab': S.commentTab = id; renderOverlay(); return;
      case 'cm-like': S.commentLikes[id] = !S.commentLikes[id]; renderOverlay(); return;
      case 'close-modal': closeModal(); return;

      // 下载
      case 'dl-quality': DL.opts.quality = node.value; toast(t('download_quality', '下载音质') + '：' + DL.QUALITIES[node.value].label); renderView(); return;
      case 'dl-auto': DL.opts.autoDeliver = !!node.checked; return;
      case 'dl-pause': DL.pause(id); return;
      case 'dl-resume': DL.resume(id); return;
      case 'dl-retry': DL.retry(id); return;
      case 'dl-remove': DL.remove(id); return;
      case 'dl-play': {
        var j = DL.all().filter(function (x) { return x.id === id; })[0];
        if (j) playFrom(j.trackId, [j.trackId]);
        return;
      }
      case 'dl-save': {
        // DL.all() 返回的是元数据（不含 Blob），必须按任务 id 取回内部 Blob 再交付
        var okSave = DL.deliverById ? DL.deliverById(id) : false;
        toast(okSave ? '已请求保存到设备' : t('download_not_ready', '文件尚未就绪'));
        return;
      }
      case 'dl-resume-all': DL.all().filter(function (j) { return j.state === 'paused'; }).forEach(function (j) { DL.resume(j.id); }); return;
      case 'dl-clear-finished': DL.clearFinished(); renderView(); return;

      // 备份 / 同步 / 其他
      case 'backup-export': {
        var data = id === 'lists' ? { lists: S.lists } : id === 'settings' ? { settings: S.settings, theme: S.theme } :
          { lists: S.lists, settings: S.settings, theme: S.theme, history: S.history };
        exportFile('lx-music-' + id + '-' + Date.now() + '.json', JSON.stringify(data, null, 2)); return;
      }
      case 'backup-import': pickFile(function (text) {
        try {
          var d = JSON.parse(text);
          if (d.lists) S.lists = S.backup.mode === 'overwrite' ? d.lists : mergeLists(d.lists);
          if (d.settings) Object.keys(d.settings).forEach(function (k) { S.settings[k] = d.settings[k]; });
          if (d.theme) { S.theme = d.theme; T.apply(d.theme); }
          if (d.history) S.history = d.history;
          save(); render(); toast(t('backup_import_success', '导入成功'));
        } catch (err) { toast('导入失败：' + err.message); }
      }); return;
      case 'backup-mode': S.backup.mode = node.value; save(); return;
      case 'sync-toggle': S.sync.connected = !!node.checked; logSync(S.sync.connected ? '已启用同步服务' : '已停用同步服务'); renderOverlay(); return;
      case 'sync-addr': S.sync.addr = node.value; save(); return;
      case 'sync-port': S.sync.port = node.value; save(); return;
      case 'sync-code': S.sync.code = node.value; save(); return;
      case 'sync-connect': logSync('尝试连接 ' + (S.sync.addr || 'localhost') + ':' + (S.sync.port || '23332'));
        S.sync.connected = true; renderOverlay(); return;
      case 'log-clear': S.errorLog = []; save(); renderOverlay(); return;
      case 'import-list': pickFile(function (text) {
        try {
          var d = JSON.parse(text), ids = (d.tracks || d.list || []).map(function (x) {
            return typeof x === 'string' ? x : x.id;
          }).filter(Boolean);
          var l = S.lists.filter(function (x) { return x.id === S.activeList; })[0];
          ids.forEach(function (tid) { if (l.trackIds.indexOf(tid) < 0) l.trackIds.push(tid); });
          save(); renderView(); toast('导入 ' + ids.length + ' 首');
        } catch (err) { toast('导入失败：' + err.message); }
      }); return;
    }
  }
  function mergeLists(incoming) {
    incoming.forEach(function (l) {
      var cur = S.lists.filter(function (x) { return x.id === l.id; })[0];
      if (cur) l.trackIds.forEach(function (tid) { if (cur.trackIds.indexOf(tid) < 0) cur.trackIds.push(tid); });
      else S.lists.push(l);
    });
    return S.lists;
  }
  function logSync(msg) {
    S.sync.log.unshift(new Date().toLocaleTimeString('zh-CN') + ' ' + msg);
    S.sync.log = S.sync.log.slice(0, 20); save();
  }
  function applySettings() {
    var b = document.body;
    b.classList.toggle('no-animation', !S.settings.fontShadow);
    engine.setRate(S.settings.playbackRate || 1);
    engine.setVolume(S.volume);
    var root = document.documentElement;
    root.style.setProperty('--lyric-align', S.settings.lyricAlign);
    root.style.fontSize = S.settings.fontSize + 'px';
    renderView();
  }
  function closeModalIfBackdrop(e) {
    var r = $('modalRoot');
    if (r && !r.classList.contains('hidden') && e.target === r) closeModal();
  }

  // ---------------------------------------------------------------- 手势 / 键盘
  var touchX = 0, touchY = 0;
  function onTouchStart(e) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }
  function onTouchEnd(e) {
    if (!S.settings.homePageScroll || S.overlay) return;
    var dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    if (dx < 0 && touchX < 30) { openDrawer(true); return; }   // 边缘右滑开抽屉
    var order = NAVS.map(function (n) { return n.id; });
    var i = order.indexOf(S.nav) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < order.length) { S.nav = order[i]; openDrawer(false); save(); render(); }
  }
  function onKey(e) {
    if (e.key === 'Escape') {
      if (S.overlay) { closeOverlay(); return; }
      var r = $('modalRoot'); if (r && !r.classList.contains('hidden')) { closeModal(); return; }
      var m = $('contextMenu'); if (m && !m.classList.contains('hidden')) { closeMenu(); return; }
      var d = $('drawer'); if (d && d.classList.contains('open')) { openDrawer(false); return; }
    }
  }

  // ---------------------------------------------------------------- 初始化
  window.LXApp = {
    state: S, engine: engine, render: render, renderView: renderView,
    renderPlayer: renderPlayer, renderOverlay: renderOverlay,
    toast: toast, save: save, esc: esc, t: t, fmt: fmt,
    playFrom: playFrom, currentTrack: currentTrack, openOverlay: openOverlay,
    closeOverlay: closeOverlay, trackList: trackList
  };

  function init() {
    restore();
    T.apply(S.theme);
    engine.setVolume(S.volume);
    engine.setRate(S.settings.playbackRate || 1);
    engine.onTick = function (pos, dur) {
      var fill = $('pbProgressFill');
      if (fill) fill.style.width = (dur ? pos / dur * 100 : 0) + '%';
      var now = $('dTimeNow'); if (now) now.textContent = fmt(pos);
      var all = $('dTimeAll'); if (all) all.textContent = fmt(dur);
      var seek = $('detailSeek'); if (seek && document.activeElement !== seek) seek.value = dur ? pos / dur * 100 : 0;
      var box = $('lyricBox');
      if (box) {
        var idx = Math.min(D.LYRICS.length - 1, Math.floor(pos / (dur || 1) * D.LYRICS.length));
        var ps = box.querySelectorAll('p');
        for (var i = 0; i < ps.length; i++) ps[i].classList.toggle('on', i === idx);
      }
      var tr = currentTrack();
      if (tr) S.progress[tr.id] = pos;
    };
    engine.onEnded = function () { S.playing = false; nextTrack(true); };
    DL.onChange(function () {
      var b = document.querySelector('.nav-badge');
      if (b) b.textContent = DL.stats().done;
    });
    render();
    document.addEventListener('click', onClick, false);
    document.addEventListener('change', function (e) {
      var n = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!n) return;
      var a = n.dataset.act;
      if (a === 'set-bool' || a === 'set-select' || a === 'set-num' ||
          a === 'dl-quality' || a === 'dl-auto' || a === 'backup-mode') onClick({ target: n });
      else if (a === 'sync-toggle' || a === 'sync-addr' || a === 'sync-port' || a === 'sync-code')
        onClick({ target: n });
    }, false);
    document.addEventListener('keydown', onKey);
    $('view').addEventListener('touchstart', onTouchStart, { passive: true });
    $('view').addEventListener('touchend', onTouchEnd, { passive: true });
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'detailSeek') {
        engine.seek(Number(e.target.value) / 100 * engine.duration);
      }
      if (e.target && e.target.id === 'searchInput') S.search.text = e.target.value;
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target && e.target.id === 'searchInput') doSearch(e.target.value);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
/* APK 专用注入补丁（只写进 assets/index.html，不修改桌面版 app/ 源码）
 * 桌面浏览器的 <a download> + blob: 在 WebView 里不会触发系统下载，
 * 这里把备份/设置导出的 Blob 文本读出后交给 EchoBridge.saveText 写入
 * Download/LX Music 目录。歌曲 WAV 走 download.js 的 EchoBridge 分块桥，不经过这里。
 */
(function () {
  'use strict';
  window.__LX_ANDROID__ = true;
  if (!window.EchoBridge || !window.EchoBridge.saveText) return;

  function readBlobText(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.responseType = 'text';
      x.onload = function () { cb(String(x.responseText || x.response || '')); };
      x.onerror = function () { cb(''); };
      x.send();
    } catch (e) { cb(''); }
  }

  try {
    var proto = HTMLAnchorElement.prototype;
    var orig = proto.click;
    proto.click = function () {
      try {
        var name = this.getAttribute('download');
        var href = this.href || '';
        if (name && href.indexOf('blob:') === 0) {
          readBlobText(href, function (txt) {
            window.EchoBridge.saveText(name, txt);
            if (window.LXApp && window.LXApp.toast) window.LXApp.toast('已保存到 Download/LX Music');
          });
          return;
        }
      } catch (e) { /* 回退到浏览器默认行为 */ }
      return orig.apply(this, arguments);
    };
  } catch (e) { /* 环境不支持时保持原状 */ }
})();

</script>
