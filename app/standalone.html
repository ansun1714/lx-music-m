/* ===== styles.css ===== */
/* LX Music v1.9.2 界面样式
 * 尺寸口径：HEADER_HEIGHT=42、LIST_ITEM_HEIGHT=54、抽屉 70%/≤300px、
 * PlayerBar 按钮 46×46 / 图标 24px、搜索栏 38px。
 * 颜色全部取自 themes.js 生成的 --c-* 变量（与原版派生算法一致）。
 *
 * v3.10.0 字号可调：所有 font-size 走 calc(Npx * var(--ui-fs))，
 * --ui-fs 由「界面字体大小」设置（基准 14px → 1.0）写入；歌词单独用 --lyric-size。
 */
:root { --ui-fs: 1; --lyric-size: 16px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: calc(14px * var(--ui-fs)); color: var(--c-font, #424242);
  background: var(--c-app-background, #f2faf6);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
.hidden { display: none !important; }
.lx-icon { font-size: calc(20px * var(--ui-fs)); color: inherit; }

.app { position: relative; display: flex; flex-direction: column; height: 100%;
  background: var(--c-app-background); }
.page { display: flex; flex-direction: column; flex: 1; min-height: 0;
  background: var(--c-main-background); }

/* ---------------------------------------------------------------- 抽屉 */
.drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 40;
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer-mask.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 41;
  width: 70%; max-width: 300px; display: flex; flex-direction: column;
  background: var(--c-content-background, #fff);
  transform: translateX(-100%); transition: transform .22s ease;
  box-shadow: 4px 0 24px rgba(0,0,0,.16); }
.drawer.open { transform: none; }
.drawer-head { padding: 40px 16px 50px; display: flex; align-items: center; justify-content: center;
  background: var(--c-primary-light-700-alpha-500, #daeee4);
  color: var(--c-primary-dark-100-alpha-300, #459e70); }
.drawer-head .lx-icon { font-size: calc(28px * var(--ui-fs)); }
.drawer-head span { margin-left: 16px; font-size: calc(28px * var(--ui-fs)); font-weight: 500; }
.drawer-menus { flex: 1; overflow-y: auto; padding: 10px 0; }
.nav-item { display: flex; align-items: center; width: 100%; padding: 13px 25px;
  color: var(--c-font); text-align: left; }
.nav-item .ni-icon { width: 24px; text-align: center; color: var(--c-font-label); }
.nav-item .ni-icon .lx-icon { font-size: calc(20px * var(--ui-fs)); }
.nav-item .ni-text { padding-left: 20px; font-size: calc(15px * var(--ui-fs)); }
.nav-item.active { background: var(--c-primary-background, rgba(182,222,201,.3)); }
.nav-item.active .ni-icon { color: var(--c-primary-font-active); }
.nav-item.active .ni-text { color: var(--c-primary-font, var(--c-primary)); font-weight: 600; }
.nav-badge { margin-left: auto; font-size: calc(11px * var(--ui-fs)); min-width: 18px; height: 18px; line-height: 18px;
  text-align: center; border-radius: 9px; background: var(--c-badge-primary, #4daf7c); color: #fff; }
.drawer-foot { border-top: 1px solid var(--c-border-background); padding: 6px 0 18px; }

/* ---------------------------------------------------------------- Header */
.header { height: 42px; min-height: 42px; display: flex; align-items: center;
  padding: 0 5px; z-index: 10; background: var(--c-main-background); }
.h-btn { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
  color: var(--c-font); }
.h-btn .lx-icon { font-size: calc(18px * var(--ui-fs)); }
.h-title { flex: 1; height: 42px; text-align: left; padding-left: 14px; font-size: calc(18px * var(--ui-fs));
  color: var(--c-font); }
.h-extra { display: flex; align-items: center; gap: 4px; }
.h-extra .lx-icon { font-size: calc(18px * var(--ui-fs)); }
/* v3.13.5：搜索页右上角的「歌曲 / 歌单」标签是死控件（只改自身高亮，不影响搜索），已删除 */

/* ---------------------------------------------------------------- 主区 */
.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  background: var(--c-main-background); -webkit-overflow-scrolling: touch; }
.pad { padding: 10px 12px 24px; }

/* 搜索页 */
.searchbar { height: 38px; display: flex; align-items: center; padding-right: 10px;
  border-bottom: 1px solid var(--c-border-background); z-index: 2; }
.src-select { position: relative; height: 100%; display: flex; align-items: center;
  padding: 0 10px; gap: 3px; color: var(--c-font); font-size: calc(14px * var(--ui-fs)); }
.src-select .lx-icon { font-size: calc(12px * var(--ui-fs)); color: var(--c-font-label); }
.search-input { flex: 1; height: 30px; border: 0; outline: 0; background: transparent;
  border-bottom: 1px solid var(--c-primary-alpha-300, rgba(77,175,124,.7)); padding: 0 6px; font-size: calc(14px * var(--ui-fs)); }
.search-go { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  color: var(--c-primary-font, var(--c-primary)); }
.tip-section { padding: 14px 14px 6px; }
.tip-title { font-size: calc(13px * var(--ui-fs)); color: var(--c-font-label); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 14px; font-size: calc(13px * var(--ui-fs));
  background: var(--c-button-background, rgba(182,222,201,.3)); color: var(--c-font); }
.welcome { text-align: center; color: var(--c-font-label); padding: 36px 0 18px; font-size: calc(15px * var(--ui-fs)); }
.sec-head { display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 6px; }
.sec-head h3 { margin: 0; font-size: calc(15px * var(--ui-fs)); font-weight: 600; }
.sec-head .lx-icon { font-size: calc(16px * var(--ui-fs)); color: var(--c-font-label); }

/* 歌曲列表：行高 54 */
.music-list { width: 100%; }
.m-row { height: 54px; display: flex; align-items: center; padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--c-border-background, rgba(0,0,0,.06)); }
.m-row:active { background: var(--c-button-background); }
.m-row.playing .m-name { color: var(--c-primary-font, var(--c-primary)); }
.m-idx { width: 26px; flex: none; text-align: center; color: var(--c-font-label); font-size: calc(12px * var(--ui-fs)); }
.m-main { flex: 1; min-width: 0; }
.m-name { font-size: calc(14px * var(--ui-fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-sub { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-meta { flex: none; font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); padding: 0 8px; text-align: right; }
.m-src { flex: none; font-size: calc(10px * var(--ui-fs)); padding: 2px 5px; border-radius: 3px;
  background: var(--c-button-background); color: var(--c-primary-font, var(--c-primary)); }
.m-act { flex: none; width: 30px; height: 40px; display: flex; align-items: center; justify-content: center;
  color: var(--c-font-label); }
.m-act .lx-icon { font-size: calc(17px * var(--ui-fs)); }
.list-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid var(--c-list-header-border-bottom, rgba(77,175,124,.1)); }
.btn { padding: 6px 12px; border-radius: 5px; font-size: calc(13px * var(--ui-fs));
  background: var(--c-button-background); color: var(--c-font); }
.btn.primary { background: var(--c-primary); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--c-border-background); }
.btn.sm { padding: 4px 9px; font-size: calc(12px * var(--ui-fs)); }
.chk { width: 18px; height: 18px; flex: none; }

/* 卡片网格（歌单 / 榜单） */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
.card { border-radius: 8px; overflow: hidden; background: var(--c-content-background);
  border: 1px solid var(--c-border-background); }
.card-cover { height: 92px; display: flex; align-items: flex-end; padding: 10px;
  color: #fff; font-size: calc(16px * var(--ui-fs)); font-weight: 600;
  background: linear-gradient(135deg, var(--card-color, #4daf7c), rgba(0,0,0,.18)); }
.card-body { padding: 8px 10px 10px; }
.card-name { font-size: calc(13px * var(--ui-fs)); line-height: 1.35; height: 36px; overflow: hidden; }
.card-sub { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); margin-top: 5px; }
/* 歌单封面：有图时铺满并压暗，名称仍压在底部 */
.pl-cover-card { position: relative; overflow: hidden; }
.pl-cover-card img { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  object-fit: cover; }
.pl-cover-card::after { content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,.6)); }
.pl-cover-card span { position: relative; z-index: 1; }
/* 歌单详情头部 */
.pl-head { display: flex; gap: 12px; padding: 14px; align-items: center; }
.pl-cover { width: 84px; height: 84px; border-radius: 8px; object-fit: cover; flex: none; }
.pl-cover.ph { display: flex; align-items: center; justify-content: center; font-size: calc(30px * var(--ui-fs));
  background: var(--c-button-background); color: var(--c-font-label); }
.pl-meta { min-width: 0; flex: 1; }
.pl-name { font-size: calc(15px * var(--ui-fs)); font-weight: 600; line-height: 1.4; margin-bottom: 6px;
  word-break: break-all; }
.tabs-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 9px 12px; white-space: nowrap; }.tabs-scroll button { padding: 5px 11px; border-radius: 13px; font-size: calc(12px * var(--ui-fs));
  background: var(--c-button-background); color: var(--c-font-label); }
.tabs-scroll button.on { background: var(--c-primary); color: #fff; }

/* 我的列表：左右布局 */
.mylist-layout { display: flex; min-height: 100%; }
.list-nav { width: 118px; flex: none; border-right: 1px solid var(--c-border-background); }
.list-nav button { display: block; width: 100%; text-align: left; padding: 12px 10px;
  font-size: calc(13px * var(--ui-fs)); color: var(--c-font-label); border-left: 3px solid transparent; }
.list-nav button.on { color: var(--c-primary-font, var(--c-primary));
  border-left-color: var(--c-primary); background: var(--c-button-background); }
.list-content { flex: 1; min-width: 0; }
.multi-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px;
  background: var(--c-button-background); flex-wrap: wrap; }

/* 设置 */
.set-group { padding: 0 0 6px; }
.set-group-title { padding: 14px 14px 7px; font-size: calc(12px * var(--ui-fs)); color: var(--c-primary-font, var(--c-primary)); }
.set-row { display: flex; align-items: center; min-height: 50px; padding: 8px 14px;
  border-bottom: 1px solid var(--c-border-background); gap: 10px; }
.set-row .sr-main { flex: 1; min-width: 0; }
.set-row .sr-name { font-size: calc(14px * var(--ui-fs)); }
.set-row .sr-desc { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); margin-top: 3px; }
.set-row select, .set-row input[type=number], .set-row input[type=text] {
  border: 1px solid var(--c-border-background); background: var(--c-content-background);
  border-radius: 4px; padding: 5px 7px; font-size: calc(13px * var(--ui-fs)); max-width: 130px; }
/* v3.10.0：设置页「滑块 + 数字框」，两者都可操作，拖动/键入实时生效 */
.set-row .sr-range { display: flex; align-items: center; gap: 8px; flex: none; }
.set-row .sr-range input[type=range] { width: 96px; height: 26px; margin: 0;
  accent-color: var(--c-primary); background: transparent; padding: 0; }
.set-row .sr-range .sr-num { width: 54px; max-width: 54px; text-align: center; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; border-radius: 11px; background: var(--c-200, #d3d3d3);
  transition: .2s; }
.switch i:before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
  border-radius: 50%; background: #fff; transition: .2s; }
.switch input:checked + i { background: var(--c-primary); }
.switch input:checked + i:before { transform: translateX(18px); }
.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 14px 14px; }
.theme-dot { height: 46px; border-radius: 6px; border: 2px solid transparent;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px;
  font-size: calc(10px * var(--ui-fs)); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.theme-dot.on { border-color: var(--c-font); }

/* 下载 */
.dl-stats { display: flex; gap: 8px; padding: 12px; }
.dl-stat { flex: 1; text-align: center; padding: 10px 4px; border-radius: 7px;
  background: var(--c-button-background); }
.dl-stat b { display: block; font-size: calc(19px * var(--ui-fs)); color: var(--c-primary-font, var(--c-primary)); }
.dl-stat span { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); }
.dl-item { padding: 10px 14px; border-bottom: 1px solid var(--c-border-background); }
/* v3.13.0：已完成的任务整行可点 → 直接播放 */
.dl-item.hit { cursor: pointer; }
.dl-item.hit:active { background: var(--c-list-active, rgba(0,0,0,.04)); }
.dl-play-ico { display: inline-flex; align-items: center; justify-content: center; margin-right: 6px;
  color: var(--c-primary, #2bb27a); font-style: normal; vertical-align: middle; }
.dl-head { display: flex; align-items: center; gap: 8px; }
.dl-name { flex: 1; min-width: 0; font-size: calc(14px * var(--ui-fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-state { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); }
.dl-bar { height: 5px; border-radius: 3px; background: var(--c-100, #e9e9e9); margin: 8px 0 6px; overflow: hidden; }
.dl-bar i { display: block; height: 100%; background: var(--c-primary); transition: width .15s; }
.dl-meta { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); display: flex; justify-content: space-between; }
.dl-acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.dl-acts button { font-size: calc(12px * var(--ui-fs)); padding: 4px 10px; border-radius: 4px;
  background: var(--c-button-background); }

/* PlayerBar */
.playerbar { position: relative; flex: none; min-height: 56px; display: flex; align-items: center;
  padding: 5px 5px 5px 5px; background: var(--c-content-background, #fff);
  border-top-left-radius: 6px; border-top-right-radius: 6px;
  box-shadow: 0 -2px 10px rgba(0,0,0,.10); z-index: 12; }
.pb-progress { position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: var(--c-border-background); }
.pb-progress i { display: block; height: 100%; width: 0; background: var(--c-primary); }
.pb-pic { width: 46px; height: 46px; flex: none; border-radius: 4px; display: flex;
  align-items: center; justify-content: center; color: #fff;
  background: linear-gradient(135deg, var(--c-primary), var(--c-primary-dark-300, #2c7a53)); }
.pb-pic .lx-icon { font-size: calc(24px * var(--ui-fs)); }
.pb-center { flex: 1; min-width: 0; padding-left: 5px; }
.pb-title { font-size: calc(14px * var(--ui-fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-info { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-ctrl { display: flex; align-items: center; flex: none; padding: 0 5px; }
.pb-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--c-button-font, var(--c-primary)); }
.pb-btn .lx-icon { font-size: calc(24px * var(--ui-fs)); }

/* 全屏页面 / 播放详情 / 评论 */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--c-main-background);
  display: flex; flex-direction: column; }
/* v3.13.4：歌单 / 榜单「目录页」不盖住底部播放条。
 * 播放条固定在 .page 末端（不在滚动容器里），浮层底边上移一个播放条高度即可，
 * 列表怎么上下滑都不会把它顶走。 */
.overlay.ov-with-bar { bottom: var(--pb-h, 56px); }
.ov-head { height: 48px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 12px; border-bottom: 1px solid var(--c-border-background); }
.ov-head .lx-icon { font-size: calc(20px * var(--ui-fs)); }
.ov-head h2 { margin: 0; font-size: calc(16px * var(--ui-fs)); font-weight: 600; flex: 1; }
.ov-body { flex: 1; min-height: 0; overflow-y: auto; }
.detail-cover { width: 62%; max-width: 260px; aspect-ratio: 1; margin: 22px auto 16px;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #fff; background: linear-gradient(135deg, var(--c-primary), var(--c-primary-dark-400, #256b48));
  box-shadow: 0 8px 26px rgba(0,0,0,.18); }
.detail-cover .lx-icon { font-size: calc(76px * var(--ui-fs)); }
.detail-title { text-align: center; font-size: calc(18px * var(--ui-fs)); }
.detail-sub { text-align: center; font-size: calc(12px * var(--ui-fs)); color: var(--c-font-label); margin-top: 5px; }
.lyric { padding: 18px 20px 30px; text-align: center; }
.lyric p { margin: 11px 0; font-size: var(--lyric-size); color: var(--c-font-label); transition: .2s; }
.lyric p.on { color: var(--c-primary-font, var(--c-primary)); font-size: calc(var(--lyric-size) * 1.12); font-weight: 600; }
.player-ctl { flex: none; padding: 8px 18px 24px; }
.time-row { display: flex; justify-content: space-between; font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); }
.seek { width: 100%; height: 4px; margin: 8px 0 12px; accent-color: var(--c-primary); }
.ctl-row { display: flex; align-items: center; justify-content: space-around; }
.ctl-row button { width: 48px; height: 48px; color: var(--c-primary-font, var(--c-primary)); }
.ctl-row .lx-icon { font-size: calc(24px * var(--ui-fs)); }
.ctl-row .big .lx-icon { font-size: calc(38px * var(--ui-fs)); }
.cm-item { padding: 12px 14px; border-bottom: 1px solid var(--c-border-background); }
.cm-user { font-size: calc(13px * var(--ui-fs)); color: var(--c-primary-font, var(--c-primary)); }
.cm-time { font-size: calc(11px * var(--ui-fs)); color: var(--c-font-label); margin-left: 8px; }
.cm-text { font-size: calc(14px * var(--ui-fs)); margin: 7px 0; line-height: 1.5; }
.cm-acts { font-size: calc(12px * var(--ui-fs)); color: var(--c-font-label); display: flex; gap: 16px; }

/* 弹层 / 菜单 / Toast */
.modal-root { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.42);
  display: flex; align-items: center; justify-content: center; padding: 24px; }

        <button class="pb-btn" data-act="next" aria-label="下一首"><i class="lx-icon lx-nextMusic"></i></button>
      </div>
    </div>
  </div>

  <div class="modal-root hidden" id="modalRoot"></div>
  <div class="ctx-menu hidden" id="contextMenu"></div>

</div>

<script>/* ===== themes.js ===== */
/* LX Music v1.9.2 主题系统
 * 移植自开源项目 src/theme/themes/{colorUtils,utils,themes/index}.js|.ts
 * 用同一套 primary 派生 232 个 c-primary-* 变量 + buildActiveThemeColors 别名，
 * 因此 16 套主题的每一处配色都与原版一致。
 */
(function () {
  'use strict';

  function parse(c) {
    var m = String(c).match(/-?[\d.]+/g);
    return m ? { r: +m[0], g: +m[1], b: +m[2], a: m.length > 3 ? +m[3] : null } : { r: 0, g: 0, b: 0, a: null };
  }
  function shade(p, c0) {
    var c = parse(c0), n = p < 0, t = n ? 0 : 255 * p, P = n ? 1 + p : 1 - p;
    var rgb = 'rgb' + (c.a == null ? '(' : 'a(') + Math.round(c.r * P + t) + ',' +
      Math.round(c.g * P + t) + ',' + Math.round(c.b * P + t);
    return rgb + (c.a == null ? ')' : ',' + c.a + ')');
  }
  function alphaShade(p, color) {
    var c = parse(color), n = p < 0, a;
    if (c.a != null) {
      a = c.a - (n ? (1 - c.a) * p : c.a * p);
      a = n ? Math.max(0, a) : Math.min(1, a);
    } else a = Math.min(1, 1 - p);
    return 'rgba(' + parseInt(c.r, 10) + ', ' + parseInt(c.g, 10) + ', ' +
      parseInt(c.b, 10) + ', ' + a.toFixed(2) + ')';
  }
  function pad3(n) { return ('000' + n).slice(-3); }

  function createThemeColors(primary, font, isDark) {
    var colors = { 'c-primary': primary }, pre, i, j;
    pre = primary;
    for (i = 1; i < 11; i++) {
      pre = shade(isDark ? 0.2 : -0.1, pre);
      colors['c-primary-dark-' + i * 100] = pre;
      for (j = 1; j < 10; j++) {
        colors['c-primary-dark-' + i * 100 + '-alpha-' + j * 100] = alphaShade(0.1 * j, pre);
        colors['c-primary-alpha-' + j * 100] = alphaShade(0.1 * j, primary);
      }
    }
    pre = primary;
    for (i = 1; i < 10; i++) {
      pre = shade(isDark ? -0.1 : 0.2, pre);
      colors['c-primary-light-' + i * 100] = pre;
      for (j = 1; j < 10; j++)
        colors['c-primary-light-' + i * 100 + '-alpha-' + j * 100] = alphaShade(0.1 * j, pre);
    }
    pre = shade(isDark ? -0.35 : 1, pre);
    colors['c-primary-light-1000'] = pre;
    for (j = 1; j < 10; j++)
      colors['c-primary-light-1000-alpha-' + j * 100] = alphaShade(0.1 * j, pre);
    colors['c-theme'] = isDark ? colors['c-primary-light-900'] : primary;

    var f = font || (isDark ? 'rgb(229, 229, 229)' : 'rgb(33, 33, 33)');
    colors['c-1000'] = f;
    if (isDark) {
      pre = f;
      for (i = 1; i < 21; i++) { pre = shade(-0.05, pre); colors['c-' + pad3(1000 - 50 * i)] = pre; }
    } else {
      for (i = 1; i < 21; i++) colors['c-' + pad3(1000 - 50 * i)] = shade(0.05 * i, f);
    }
    return colors;
  }

  // id / 名称 / primary / 是否深色 —— 全部取自 createThemes.js
  var THEMES = [
    { id: 'green', name: '绿意盎然', primary: 'rgb(77, 175, 124)' },

    { id: 'grey', name: '灰常美丽', primary: 'rgb(108, 122, 137)' },
    { id: 'ming', name: '青出于黑', primary: 'rgb(51, 110, 123)' },
    { id: 'blue2', name: '清热板蓝', primary: 'rgb(79, 98, 208)' },
    { id: 'black', name: '黑灯瞎火', primary: 'rgb(190, 190, 190)', dark: true },
    { id: 'mid_autumn', name: '月里嫦娥', primary: 'rgb(74, 55, 82)' },
    { id: 'naruto', name: '木叶之村', primary: 'rgb(87, 144, 167)' },
    { id: 'china_ink', name: '近墨者黑', primary: 'rgba(47, 47, 47, 1)' },
    { id: 'happy_new_year', name: '新年快乐', primary: 'rgb(192, 57, 43)' }
  ];

  var ALIASES = {

<script>/* ===== engine.js ===== */
/* 播放引擎
 * - 自定义音源曲目：用 <audio> 播放在线 URL / data: 音频（mode='stream'）
 * - 已下载曲目：用 <audio> 播放本地 Blob（mode='local'）
 * - 其余曲目：Web Audio 实时合成柔和演示音轨（mode='synth'，无网络请求）
 * - 支持播放速率、音量、进度、播放结束回调
 * - 音效开启时才把 <audio> 接进 Web Audio；关闭时走原生播放（避免 CORS 静音与节点累积）
 */
(function () {
  'use strict';

  /* 原生媒体代理（v3.9.0）
   * 音源返回的音频大多没有任何 CORS 响应头：<audio> 一旦设置 crossOrigin 再接进 Web Audio，
   * 浏览器会判定为「跨域污染」直接静音，真机上的表现就是「两个平台有音效、另外的平台提示
   * 音源不允许跨域」。这里把远端地址交给原生壳，由它在本源（app.echo.local）下转发字节流
   * 并透传 Range，于是 <audio> 与页面同源 —— 音效全平台可用，进度条也能拖动。 */
  function b64(s) {
    try { return btoa(unescape(encodeURIComponent(String(s)))); }
    catch (e) { return ''; }
  }

  var MediaProxy = {
    available: function () {
      var B = window.EchoBridge;
      return !!(B && typeof B.mediaProxyBase === 'function');
    },
    wrap: function (url, headers) {
      if (!MediaProxy.available() || !/^https?:/i.test(String(url || ''))) return '';
      // 已经在本应用源下的地址（例如 /__local 的本地文件）本身同源，再套一层代理只会自己绕自己
      try { if (new URL(url).host === location.host) return ''; } catch (e) {}
      var base;
      try { base = window.EchoBridge.mediaProxyBase(); } catch (e) { return ''; }
      if (!base) return '';
      var enc = b64(url);
      if (!enc) return '';
      var out = base + '?u=' + encodeURIComponent(enc);
      var hs = '';
      try {
        if (headers && Object.keys(headers).length) hs = b64(JSON.stringify(headers));
      } catch (e) { hs = ''; }
      if (hs) out += '&h=' + encodeURIComponent(hs);
      return out;
    }
  };
  window.LXMediaProxy = MediaProxy;

  function AudioEngine() {
    this.ctx = null;
    this.gain = null;
    this.src = null;
    this.buffer = null;
    this.el = null;               // 本地文件模式
    this.mode = 'synth';
    this.playing = false;
    this.offset = 0;
    this.startCtxTime = 0;
    this.duration = 0;
    this.playbackRate = 1;
    this.volume = 0.8;
    this.track = null;
    this.onTick = null;
    this.onEnded = null;
    this._timer = null;
  }

  AudioEngine.prototype._ensureCtx = function () {
    if (this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    this.gain = this.ctx.createGain();
    this.gain.gain.value = this.volume;
    this.input = this.gain;
    /* 音效链：gain → 10 段 EQ → 干/湿混响 → 环绕 → destination。
     * 没有音效模块（或图建失败）时直连，保证永远能出声。 */
    var mounted = false;
    if (window.LXSound && typeof window.LXSound.mount === 'function') {
      try { mounted = window.LXSound.mount(this.ctx, this.gain, this.ctx.destination); }
      catch (e) { mounted = false; }
    }
    if (!mounted) this.gain.connect(this.ctx.destination);
  };

  // 生成一条与曲目时长一致的柔和音轨（正弦叠加 + 缓慢包络）
  AudioEngine.prototype._synth = function (track) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    var dur = Math.min(track.duration || 120, 180);
    var sr = 22050, n = Math.floor(sr * dur);
    var buf = this.ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    var seed = 0;
    for (var i = 0; i < track.id.length; i++) seed += track.id.charCodeAt(i);
    var base = 174 + (seed % 7) * 18;
    for (var k = 0; k < n; k++) {
      var t = k / sr;
      var beat = t * (base / 60);
      var v = Math.sin(2 * Math.PI * base * t) * 0.34
        + Math.sin(2 * Math.PI * base * 1.5 * t) * 0.18
        + Math.sin(2 * Math.PI * base * 2 * t) * 0.10;
      var pulse = 0.72 + 0.28 * Math.sin(beat * Math.PI * 2);
      var env = Math.min(1, t / 1.2) * Math.min(1, (dur - t) / 1.6);
      d[k] = Math.max(-1, Math.min(1, v * pulse * env * 0.55));
    }
    return buf;
  };

  /* 是否接管音频图。
   * v3.13.0：只要音效总开关打开就接管 —— 原来还要求「EQ / 混响 / 环绕至少有一项非平」，
   * 于是用户刚打开开关、参数全为 0 时会觉得「开了没反应」。现在开关即生效（图接上，
   * 音量与后续调节都走 Web Audio）；关闭时回到原生播放，完全不创建 MediaElementSource。
   * 跨域音频由 /__media 与 /__local 同源代理兜底，真遇到加载失败仍会自动退回原生并提示。 */
  AudioEngine.prototype.graphEnabled = function () {
    var S = window.LXSound;
    if (!S || typeof S.state !== 'function') return false;
    return !!S.state().enabled;
  };

  /* 音效参数是否真的在起作用（EQ 非平 / 混响 / 环绕）。 */
  AudioEngine.prototype.graphMatters = function () {
    var S = window.LXSound;
    if (!S || typeof S.state !== 'function') return false;
    var st = S.state();
    if (!st || !st.enabled) return false;
    var flat = (st.eq || []).every(function (v) { return !v; });
    return !flat || (st.reverb && st.reverb !== 'none') || !!st.surround;
  };

  /* 这条音源要不要接 Web Audio。
   * v3.13.1：本地文件（已下载 / blob，本身同源）开关一开就接管；
   * 在线音源只有在「参数真的非平」时才改走同源媒体代理 —— 否则打开开关的一瞬间就把正在放的
   * 网络音频重建成代理地址，源站稍有风吹草动就加载失败，用户看到的是「开音效就报错」。
   * 一旦用户真的调了 EQ/混响/环绕，仍然走 v3.9.0 的 /__media 代理路径（那条路是验过 40 项的）。 */
  AudioEngine.prototype.wantGraph = function (ref) {
    if (!this.graphEnabled()) return false;
    var kind = (ref && ref.kind) || this.mode;
    if (kind === 'downloaded' || kind === 'local') return true;
    return this.graphMatters();
  };

  /* ---------- 音频字节缓存（v3.13.2）：把在线音频取成本地 Blob ----------
   * 为什么不再只靠 /__media：媒体代理是一次「重路由」，源站稍有波动（502 / 不认 Range /
   * 必须带 Referer / 返回 302 到别的 CDN）就会加载失败；而 <audio> 一旦是跨域且没 CORS 头，
   * 接进 Web Audio 会被判污染直接**静音**（不报错、也没声音，正是用户遇到的「开了没声音」）。
   * 所以接入音效时先把整段音频经原生桥取回来（不受 CORS 限制，能带请求头），
   * 存成本源 Blob 再交给 <audio> —— 同源、无 Range 依赖、必然能进图。 */
  AudioEngine.prototype._blobCache = {};
  AudioEngine.prototype._blobOrder = [];

  AudioEngine.prototype._cacheBlob = function (url, mime, blobUrl) {
    var self = this;
    if (!url || !blobUrl) return;
    if (this._blobCache[url]) { try { URL.revokeObjectURL(this._blobCache[url]); } catch (e) {} }
    else this._blobOrder.push(url);
    this._blobCache[url] = blobUrl;
    while (this._blobOrder.length > 3) {
      var old = this._blobOrder.shift();
      var u = self._blobCache[old];
      if (u) { try { URL.revokeObjectURL(u); } catch (e) {} delete self._blobCache[old]; }
    }
  };

  /* 把 base64 分片解码成 Blob parts（v3.13.3）：
   * 真机上几十 MB 的整串 base64 一次性 atob 会产生「巨大的二进制字符串 + 同样大的 Uint8Array」，
   * 叠上 Java 侧的分块串就有 OOM 风险。按 512KB 切片解码，每片只占一小块内存。 */
  AudioEngine.prototype._b64ToParts = function (b64, maxBytes) {
    var SLICE = 524288;                                  // 必须是 4 的倍数
    var parts = [];
    var total = 0;
    for (var off = 0; off < b64.length; off += SLICE) {
      var chunk = b64.substr(off, SLICE);
      var bin = atob(chunk);
      total += bin.length;
      if (maxBytes && total > maxBytes) throw new Error('文件过大（超过 ' + Math.floor(maxBytes / 1048576) + 'MB），已跳过音效');
      var u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      parts.push(u8);
    }
    return { parts: parts, bytes: total };
  };

  AudioEngine.prototype._fetchBytes = function (url, headers, cb) {
    /* 优先用原生桥（LXSourceAPI.request 内部走 EchoBridge.httpRequest，binary=true 返回 base64）：
     * 不受 CORS / 混合内容限制，还能带上音源要求的 Referer / UA。
     * v3.13.3：原生侧改成「边读边 Base64、分块回传」，并限制 24MB，避免整份 Base64 撑爆内存闪退。 */
    var MAXB = 24 * 1024 * 1024;
    var api = window.LXSourceAPI;
    if (api && typeof api.request === 'function' &&
        window.EchoBridge && typeof window.EchoBridge.httpRequest === 'function') {
      api.request(url, { method: 'GET', headers: headers || {}, binary: true, timeout: 60000 },
        function (err, resp) {
          if (err || !resp) return cb(err || new Error('empty response'));
          if (resp.statusCode && resp.statusCode >= 400) return cb(new Error('HTTP ' + resp.statusCode));
          if (!resp.__base64 || !resp.body) return cb(new Error('not binary'));
          try {
            var got = this._b64ToParts(String(resp.body).replace(/\s/g, ''), MAXB);
            cb(null, new Blob(got.parts, { type: 'audio/mpeg' }), got.bytes);
          } catch (e) { cb(e); }
        }.bind(this));
      return;
    }
    /* 浏览器预览（没有原生桥）时退回 window.fetch；跨域源会失败，那就保持原生播放 */
    var F = window.fetch;
    if (typeof F !== 'function') return cb(new Error('no fetcher'));
    F.call(window, url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.blob();
    }).then(function (b) {
      if (b.size > MAXB) throw new Error('文件过大（超过 ' + Math.floor(MAXB / 1048576) + 'MB），已跳过音效');
      cb(null, b, b.size);
    }).catch(function (e) { cb(e); });
  };

  /* 把当前在线音频换成同源 Blob，再接管音频图。
   * 关键：先让旧的（原生）<audio> 继续出声，同时把 Blob 元素**预加载到 canplay**，
   * 一切就绪才在同一位置一次性切换 —— 中间不会出现「打开了音效却没声音」的空档。 */
  AudioEngine.prototype._swapToGraphable = function (url, ref, pos, was) {
    var self = this;
    var nx = new Audio();
    nx.preload = 'auto';
    nx.playbackRate = this.playbackRate;
    nx.volume = 0;                     // 未切换前绝对不出声，避免两个源同时响
    nx.src = url;
    var key = url;
    var done = false;
    var timer = setTimeout(function () { finish(new Error('预加载超时')); }, 12000);
    function finish(err) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      nx.removeEventListener('canplay', onCanPlay);
      nx.removeEventListener('error', onErr);
      if (err || self._blobPending !== (ref.origin || key)) return;
      /* 用「切换这一刻」的位置，而不是发起请求时的位置：
       * 取字节要走网络，期间旧元素一直在播，用旧位置会让进度往回跳（听到一小段重复）。
       * 注意必须先取位置再摘 src —— removeAttribute('src') 会把 currentTime 归零。 */
      var now = self.position();
      /* 切换：暂停老元素、摘掉它的 source，让 WebView 回收解码器 */
      try { if (self.el) { self.el.pause(); self.el.removeAttribute('src'); self.el.load(); } } catch (e) {}
      if (self.mediaSrc) { try { self.mediaSrc.disconnect(); } catch (e) {} self.mediaSrc = null; }
      nx.volume = 1;
      self._blobPending = null;        // 成功接管后必须清标记，否则后续 rebuild 会被「已在取字节」挡住
      self._cloneFrom(nx, url, ref, now > 0 ? now : pos, was);
    }
    function onCanPlay() { finish(null); }
    function onErr() { finish(new Error('blob 加载失败')); }
    nx.addEventListener('canplay', onCanPlay);
    nx.addEventListener('error', onErr);
    if (nx.readyState >= 3) finish(null);

    '  { songmid: "demo-01", name: "夜落之前", singer: "青屿乐团", album: "海边的第七封信", duration: 118 },',
    '  { songmid: "demo-02", name: "把夜色折好", singer: "北岸电台", album: "慢速城市", duration: 128 },',
    '  { songmid: "demo-03", name: "雨停之后", singer: "林间信号", album: "潮湿的晴天", duration: 96 },',
    '  { songmid: "demo-04", name: "北纬三十度", singer: "青屿乐团", album: "远行记", duration: 142 },',
    '  { songmid: "demo-05", name: "给未来的便签", singer: "小白鲸", album: "抽屉里的海", duration: 105 },',
    '  { songmid: "demo-06", name: "凌晨三点的站台", singer: "北岸电台", album: "慢速城市", duration: 132 }',
    ']',
    'const cache = {}',
    'function wav(seed) {',
    '  if (cache[seed]) return cache[seed]',
    '  const sr = 6000, sec = 8, n = sr * sec, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf)',
    '  function str(o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)) }',
    '  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE")',
    '  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true)',
    '  v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true)',
    '  v.setUint16(32, 2, true); v.setUint16(34, 16, true)',
    '  str(36, "data"); v.setUint32(40, n * 2, true)',
    '  let h = 0; for (let i = 0; i < seed.length; i++) h += seed.charCodeAt(i)',
    '  const base = 196 + (h % 9) * 22',
    '  for (let k = 0; k < n; k++) {',
    '    const t = k / sr',
    '    const s = Math.sin(2 * Math.PI * base * t) * 0.36 + Math.sin(2 * Math.PI * base * 1.5 * t) * 0.16',
    '    const env = Math.min(1, t / 0.6) * Math.min(1, (sec - t) / 0.8)',
    '    v.setInt16(44 + k * 2, Math.max(-1, Math.min(1, s * env * 0.6)) * 32767, true)',
    '  }',
    '  const b64 = utils.buffer.bufToString(new Uint8Array(buf), "base64")',
    '  cache[seed] = "data:audio/wav;base64," + b64',
    '  return cache[seed]',
    '}',
    'function song(mid) { return library.find(x => x.songmid === mid) || library[0] }',
    'on(EVENT_NAMES.request, ({ source, action, info }) => {',
    '  switch (action) {',
    '    case "search": {',
    '      const kw = String(info.keyword || "").toLowerCase()',
    '      const list = library.filter(x => !kw || (x.name + x.singer + x.album).toLowerCase().includes(kw))',
    '      return Promise.resolve(list.map(x => Object.assign({}, x, {',
    '        source, qualitys: ["128k", "320k", "flac"], ext: "wav", mime: "audio/wav" })))',
    '    }',
    '    case "musicUrl": return Promise.resolve(wav(info.musicInfo.songmid))',
    '    case "downloadUrl": {',
    '      const x = song(info.musicInfo.songmid)',
    '      return Promise.resolve({',
    '        data: wav(x.songmid), mime: "audio/wav", ext: "wav",',
    '        filename: x.name + " - " + x.singer + ".wav",',
    '        qualitys: ["128k", "320k", "flac"]',
    '      })',
    '    }',
    '    case "lyric": return Promise.resolve({ lyric: "[00:00]示例音源 · 本地演示歌词\\n[00:12]音源脚本由 JS 提供\\n[00:24]可在线试听与按格式下载" })',
    '    case "pic": return Promise.resolve("")',
    '    default: return Promise.reject(new Error("unsupported action: " + action))',
    '  }',
    '})',
    'send(EVENT_NAMES.inited, {',
    '  sources: {',
    '    local: {',
    '      name: "示例本地曲库", type: "music",',
    '      actions: ["musicUrl", "lyric", "pic", "search", "downloadUrl"],',
    '      qualitys: ["128k", "320k", "flac", "flac24bit"]',
    '    }',
    '  }',
    '})'
  ].join('\n');

  /* 在线接口模板：用户可把 URL 换成自己的服务，展示 lx.request 的真实用法 */
  var HTTP_TEMPLATE = [
    '/**',
    ' * @name 我的在线音源',
    ' * @description 通过 lx.request 调用自己的 HTTP 接口',
    ' * @version 1.0.0',
    ' * @author me',
    ' * @homepage https://example.com',
    ' */',
    'const { EVENT_NAMES, request, on, send } = globalThis.lx',
    'const BASE = "https://example.com/api"',
    'function get(path) {',
    '  return new Promise((resolve, reject) => {',
    '    request(BASE + path, { method: "get", timeout: 15000 }, (err, resp, body) => {',
    '      if (err) return reject(err)',
    '      try { resolve(JSON.parse(body)) } catch (e) { reject(e) }',
    '    })',
    '  })',
    '}',
    'on(EVENT_NAMES.request, ({ source, action, info }) => {',
    '  switch (action) {',
    '    case "search":',
    '      return get("/search?kw=" + encodeURIComponent(info.keyword))',
    '        .then(r => r.list.map(x => ({ songmid: x.id, name: x.name, singer: x.artist,',
    '          album: x.album, duration: x.duration, ext: x.ext || "mp3",',
    '          qualitys: ["128k", "320k"], source })))',
    '    case "musicUrl":',
    '      return get("/url?id=" + info.musicInfo.songmid + "&quality=" + info.type).then(r => r.url)',
    '    case "downloadUrl":',
    '      return get("/url?id=" + info.musicInfo.songmid + "&quality=" + info.type)',
    '        .then(r => ({ url: r.url, mime: r.mime || "audio/mpeg", ext: r.ext || "mp3",',
    '          filename: info.musicInfo.name + " - " + info.musicInfo.singer + ".mp3" }))',
    '    case "lyric": return get("/lyric?id=" + info.musicInfo.songmid)',
    '    default: return Promise.reject(new Error("unsupported action"))',
    '  }',
    '})',
    'send(EVENT_NAMES.inited, {',
    '  sources: {',
    '    kw: { name: "我的音源", type: "music",',
    '      actions: ["musicUrl", "search", "downloadUrl", "lyric"],',
    '      qualitys: ["128k", "320k"] }',
    '  }',
    '})'

  /* 原版语义：音源脚本在 send(inited, { sources: { kw: ..., kg: ... } }) 里声明
   * 自己能服务哪些平台。这里按 key 自动匹配；「默认音源」只是优先级，不是逐平台绑定。 */
  function platformProviders(platformId) {
    return list.filter(function (a) {
      return a.enabled && a.status === 'success' && a.sources && a.sources[platformId];
    });
  }
  /* 平台用哪个音源解析地址：
   * 1) 用户设了「默认音源」，且它声明了该平台 → 用默认音源；
   * 2) 否则取第一个声明该平台的已启用音源。

  function forPlatform(platformId) {
    var d = byId(defaultId);
    if (d && d.enabled && d.status === 'success' && d.sources && d.sources[platformId]) return d.id;

  function verifyPlatform(platformId) {
    var id = forPlatform(platformId);

      var any = list.filter(function (a) { return a.enabled; });

        message: any.length
          ? '已导入的音源都没有声明支持该平台（脚本 sources 里缺少 “' + platformId + '”）'

  }

  // ---------------------------------------------------------------- 默认音源
  /* 全局只有一个「默认音源」：搜索、切平台、解析播放/下载地址都优先用它。
   * 它声明了哪些平台，就自动服务哪些平台（脚本 sources 的 key）。 */
  function setDefault(id) {
    if (id) {
      var a = byId(id);
      if (!a) return { ok: false, message: '音源不存在' };
      if (!a.enabled) return { ok: false, message: '请先启用该音源' };
      if (a.status !== 'success') return { ok: false, message: '音源初始化失败：' + (a.message || a.status) };
    }
    defaultId = id || '';
    try { localStorage.setItem(DEFAULT_KEY, defaultId); } catch (e) {}
    log(defaultId ? '默认音源 → ' + byId(defaultId).name : '已取消默认音源');
    emit();
    return { ok: true, message: defaultId ? '已设为默认音源' : '已取消默认音源' };
  }
  function defaultApi() { return byId(defaultId); }
  function isDefault(id) { return !!id && id === defaultId; }
  function loadDefault() {
    try { defaultId = localStorage.getItem(DEFAULT_KEY) || ''; } catch (e) { defaultId = ''; }
    // 音源被删掉时清空默认值
    if (defaultId && !byId(defaultId)) { defaultId = ''; try { localStorage.removeItem(DEFAULT_KEY); } catch (e) {} }
  }

  /* 从原始地址重新拉取脚本（音源卡片的「更新」）。
   * 只有在线导入的源有可更新的地址；本地文件源需要重新导入文件。 */
  function refresh(id) {
    var a = byId(id);
    if (!a) return Promise.resolve({ ok: false, message: '音源不存在' });
    var origin = String(a.origin || '');
    var m = origin.match(/^online:(.+)$/);
    var url = m ? m[1] : (/^https?:\/\//i.test(origin) ? origin : '');
    if (!url) return Promise.resolve({ ok: false, message: '该音源来自本地文件，请重新导入文件来更新' });
    var oldVersion = a.version || '';
    return new Promise(function (resolve) {
      API.request(url, { method: 'get', timeout: 20000 }, function (err, resp, body) {
        if (err) { resolve({ ok: false, message: '更新失败：' + String(err.message || err) }); return; }
        var text = resp && resp.__base64
          ? API.bytesToUtf8(API.b64ToBytes(body)) : String(body || '');

        if (r.ok && r.api) {

          r.message = (oldVersion && nv && oldVersion !== nv)

  /* 验证状态：脚本是否合规可用（初始化成功 + 声明了 musicUrl） */
  function verify(apiId) {
    var a = byId(apiId);

    if (!a.enabled) return { ok: false, status: 'disabled', message: '已停用' };

  }

  /* 只针对某个音源搜索（供平台适配器回退用） */
  function searchByApi(apiId, keyword, opts) {
    opts = opts || {};

    var q = String(keyword || '').trim();
    if (!a || !q || !supports(a, 'search')) {

    }
    var keys = (opts.platform && a.sources && a.sources[opts.platform])
      ? [opts.platform] : sourceKeys(a, 'search');
    var out = [], errors = [], called = 0;
    return Promise.all(keys.map(function (sk) {
      called++;
      return API.invoke(runtimes[a.id], sk, 'search', {
        keyword: q, page: opts.page || 1, limit: opts.limit || 30, source: sk,
        type: opts.type || 'music'
      }, 25000).then(function (res) {
        var arr = Array.isArray(res) ? res : (res && (res.list || res.tracks || res.result)) || [];
        arr.forEach(function (raw) {
          var tr = normalizeTrack(raw, a, sk);
          if (tr) {
            tr.platform = opts.platform || tr.platform;
            out.push(tr);
          }
        });
      }).catch(function (e) {
        errors.push(a.name + '：' + String(e && e.message || e));
      });
    })).then(function () {
      if (window.LXData && window.LXData.addExternalTracks) window.LXData.addExternalTracks(out);
      return { tracks: out, errors: errors, called: called };
    });
  }

  function leaderboardByApi(apiId, boardId, opts) {
    opts = opts || {};
    var a = byId(apiId);
    if (!a || !supports(a, 'leaderboard')) {
      return Promise.resolve({ tracks: [], errors: [], called: 0 });
    }
    var keys = (opts.platform && a.sources && a.sources[opts.platform])
      ? [opts.platform] : sourceKeys(a, 'leaderboard');
    var out = [], errors = [], called = 0;
    return Promise.all(keys.map(function (sk) {
      called++;
      return API.invoke(runtimes[a.id], sk, 'leaderboard', {
        id: boardId, boardId: boardId, source: sk, page: opts.page || 1, limit: opts.limit || 30
      }, 25000).then(function (res) {
        var arr = Array.isArray(res) ? res : (res && (res.list || res.tracks || res.result)) || [];
        arr.forEach(function (raw) {
          var tr = normalizeTrack(raw, a, sk);
          if (tr) { tr.platform = opts.platform || tr.platform; out.push(tr); }
        });
      }).catch(function (e) {
        errors.push(a.name + '：' + String(e && e.message || e));
      });
    })).then(function () {
      if (window.LXData && window.LXData.addExternalTracks) window.LXData.addExternalTracks(out);
      return { tracks: out, errors: errors, called: called };
    });
  }

  // ---------------------------------------------------------------- 恢复
  function restore() {
    var raw;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
    if (Array.isArray(raw)) {
      raw.slice(0, MAX).forEach(function (m) {
        var a = {
          id: m.id, name: m.name, description: m.description, version: m.version,
          author: m.author, homepage: m.homepage, script: m.script,
          enabled: m.enabled !== false, allowUpdateAlert: m.allowUpdateAlert !== false,
          builtin: !!m.builtin, origin: m.origin || '', status: 'initing',
          message: t('setting_basic_source_status_initing', '初始化中'), sources: {}
        };
        list.push(a);
      });
    }
    // v3.2.0 起不再预置示例音源：用户要求清掉测试音乐、只用自己的音源。
    // 旧版本装过的 builtin 条目在升级时一并移除（脚本模板仍可在「示例脚本」里查看）。
    var builtinCount = list.filter(function (a) { return a.builtin; }).length;
    if (builtinCount) {
      list = list.filter(function (a) { return !a.builtin; });
      log('已移除 ' + builtinCount + ' 个旧版预置示例音源');
    }
    list.forEach(function (a) {
      if (a.enabled) initRuntime(a);
      else { a.status = 'disabled'; a.message = '已停用'; }
    });
    persist();
  }

  restore();

  window.LXSources = {
    MAX: MAX, list: function () { return list.slice(); },
    active: active, byId: byId, supports: supports, sourceKeys: sourceKeys,
    parseHeader: parseHeader, importScript: importScript, importOnline: importOnline,
    remove: remove, setEnabled: setEnabled, setAllowUpdateAlert: setAllowUpdateAlert,
    search: search, songList: songList, leaderboard: leaderboard, resolveMedia: resolveMedia,
    searchByApi: searchByApi, leaderboardByApi: leaderboardByApi, trackSource: trackSource,
    sourceChain: sourceChain,
    lastError: function (track) {

    },
    defaultApi: defaultApi, setDefault: setDefault, isDefault: isDefault, refresh: refresh, verify: verify,
    platformProviders: platformProviders, forPlatform: forPlatform, verifyPlatform: verifyPlatform,

    normalizeTrack: normalizeTrack, normalizeMedia: normalizeMedia,
    builtinScript: function () { return BUILTIN; },
    httpTemplate: function () { return HTTP_TEMPLATE; },
    logs: function () { return logs.slice(); },
    clearLogs: function () { logs = []; },
    onChange: function (fn) { listeners.push(fn); },
    esc: esc, t: t,
    hasSearch: function () { return active().some(function (a) { return supports(a, 'search'); }); },
    hasLeaderboard: function () { return active().some(function (a) { return supports(a, 'leaderboard'); }); },
    boardProviders: function () { return active().filter(function (a) { return supports(a, 'leaderboard'); }); },
    // 已启用的音源（不论是否支持 search）——主界面「搜索平台」下拉用
    enabledList: function () { return list.filter(function (a) { return a.enabled; }); }
  };
})();

/* 纯 JS 加密工具（v3.6.0）
 * 网易搜索需要 AES-128-ECB(eapi)，QQ 搜索需要 zzcSign（SHA1 取位 + XOR + base64）。
 * WebView 里没有 node:crypto，这里给出与 lxserver 完全一致的纯 JS 实现。
 * 只做加密，不做解密——搜索只需要发请求。
 */
(function () {
  'use strict';

  // ---------------------------------------------------------------- 字节工具
  function utf8Bytes(str) {
    var s = String(str), out = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) {
        out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      } else if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length) {

          out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f),

        out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));

  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

      n = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];
      out += B64[(n >> 18) & 63] + B64[(n >> 12) & 63] + B64[(n >> 6) & 63] + B64[n & 63];
    }

    if (rest === 1) {

  // ---------------------------------------------------------------- MD5

        var sum = (A + f + MD5_K[i] + (words[off + g] | 0)) | 0;
        var sh = MD5_S[(i >> 4) * 4 + (i % 4)];

    var ar = s.ar || s.artists || [];
    var al = s.al || s.album || {};
    var singers = ar.map(function (a) { return a && a.name; }).filter(Boolean);
    var singer = decodeEntities(singers.join('、'));
    var img = al.picUrl || '';
    return {
      id: 'wy_' + s.id,
      platform: 'wy',
      songmid: String(s.id),
      name: decodeEntities(s.name),
      singer: singer || '未知歌手',
      album: decodeEntities(al.name || ''),
      albumId: al.id || '',
      duration: dur,
      time: fmt(dur),
      interval: fmt(dur),
      img: img,
      source: 'wy',
      sourceLabel: '网易云音乐',
      qualitys: wyQualitys(s, s.privilege),
      _raw: {
        songmid: String(s.id), id: String(s.id), name: s.name, singer: singers.join('、'),
        albumName: al.name || '', albumId: al.id || '', interval: fmt(dur),
        duration: dur, picUrl: img
      }
    };
  }

  function wyBoard(boardId, page, limit) {
    var url = 'https://music.163.com/api/playlist/detail?id=' + encodeURIComponent(boardId) +
      '&n=' + (limit || 100);
    return httpJson(url, {
      headers: { 'User-Agent': UA, Referer: 'https://music.163.com/' }
    }).then(function (d) {
      var arr = (d.result && d.result.tracks) || [];
      return arr.map(wySongTrack).filter(Boolean);
    });
  }

  /* QQ 榜单：musicu.fcg 的 GetDetail 现在只回精简曲目（无 mid/file），
   * 改用老接口 fcg_v8_toplist_cp，返回值里带完整 songmid / file 体积。 */
  function txBoardTrack(d) {
    if (!d || !d.songmid) return null;
    var dur = Number(d.interval) || 0;
    var singers = (d.singer || []).map(function (x) { return x && x.name; }).filter(Boolean);
    var singer = decodeEntities(singers.join('、'));
    var file = {
      media_mid: d.strMediaMid || d.songmid,
      size_128mp3: d.size128, size_320mp3: d.size320,
      size_flac: d.sizeflac, size_hires: d.sizehires, size_master: d.sizemaster
    };
    return {
      id: 'tx_' + d.songmid,
      platform: 'tx',
      songmid: d.songmid,
      songId: d.songid || '',
      name: decodeEntities(d.songname || ''),
      singer: singer || '未知歌手',
      album: decodeEntities(d.albumname || ''),
      albumId: d.albummid || '',
      duration: dur,
      time: fmt(dur),
      interval: fmt(dur),
      img: d.albummid ? 'https://y.gtimg.cn/music/photo_new/T002R300x300M000' + d.albummid + '.jpg' : '',
      source: 'tx',
      sourceLabel: 'QQ音乐',
      qualitys: txQualitys(file),
      _raw: {
        songmid: d.songmid, songid: d.songid, media_mid: file.media_mid,
        name: d.songname || '', singer: singers.join('、'),
        albumName: d.albumname || '', albumMid: d.albummid || '',
        interval: fmt(dur), duration: dur
      }
    };
  }

  function txBoard(boardId, page, limit) {
    var begin = (page - 1) * limit;
    var url = 'https://c.y.qq.com/v8/fcg-bin/fcg_v8_toplist_cp.fcg?topid=' + encodeURIComponent(boardId) +
      '&song_begin=' + begin + '&song_num=' + limit + '&format=json&platform=yqq&needNewCode=1&tpl=3';
    return httpJson(url, { headers: { 'User-Agent': UA, Referer: 'https://y.qq.com/' } })
      .then(function (d) {
        var arr = (d.songlist || []).map(function (x) { return x && x.data; });
        return arr.map(txBoardTrack).filter(Boolean);
      });
  }

  // ------------------------------------------------------------------ 推荐歌单
  function kwPlaylists(page) {
    var url = 'http://wapi.kuwo.cn/api/pc/classify/playlist/getRcmPlayList?loginUid=0&loginSid=0' +
      '&appUid=76039576&pn=' + page + '&rn=24&order=hot';
    return httpJson(url, { headers: { 'User-Agent': UA, Referer: 'http://www.kuwo.cn/' } })
      .then(function (d) {
        if (d.code !== 200) throw new Error(d.message || ('酷我歌单 code=' + d.code));
        var arr = (d.data && d.data.data) || [];
        return arr.map(function (x) {
          return {
            id: String(x.id), name: decodeEntities(x.name), img: x.img || '',
            author: decodeEntities(x.uname || ''), play: String(x.listencnt || ''),
            count: Number(x.total) || 0
          };
        });
      });
  }

  function kgPlaylists(page) {
    var url = 'http://m.kugou.com/plist/index?json=true&page=' + page;
    return httpJson(url, { headers: { 'User-Agent': UA } }).then(function (d) {
      var arr = (d.plist && d.plist.list && d.plist.list.info) || [];
      return arr.map(function (x) {
        return {
          id: String(x.specialid), name: decodeEntities(x.specialname),
          img: String(x.imgurl || '').replace('{size}', '400'),
          author: decodeEntities(x.nickname || ''), play: String(x.playcount || ''),
          count: Number(x.songcount) || 0
        };
      });
    });
  }

  /* 咪咕歌单广场：返回的是多层页面模板，歌单节点统一为 ZJ-SongList-Item */
  function mgPlaylists(page) {
    var url = 'https://app.c.nf.migu.cn/pc/bmw/page-data/playlist-square-recommend/v1.0' +
      '?templateVersion=2&pageNo=' + page;
    return httpJson(url, { headers: MG_HEADERS }).then(function (d) {
      if (d.code !== '000000') throw new Error(d.info || ('咪咕歌单 ' + d.code));
      var out = [], seen = {};
      (function walk(o) {
        if (!o || typeof o !== 'object') return;
        if (Array.isArray(o)) { o.forEach(walk); return; }
        if (o.view === 'ZJ-SongList-Item' && typeof o.action === 'string') {
          var m = o.action.match(/[?&]id=(\d+)/);
          if (m && !seen[m[1]]) {
            seen[m[1]] = 1;
            out.push({
              id: m[1], name: decodeEntities(o.txt || ''), img: o.img || '',
              author: '', play: String(o.txt2 || ''), count: 0
            });
          }
        }
        Object.keys(o).forEach(function (k) { walk(o[k]); });
      })(d.data);
      return out;
    });
  }

  function wyPlaylists(page) {
    var url = 'https://music.163.com/api/personalized/playlist?limit=30&offset=' + ((page - 1) * 30);
    return httpJson(url, { headers: { 'User-Agent': UA, Referer: 'https://music.163.com/' } })
      .then(function (d) {
        return (d.result || []).map(function (x) {
          return {
            id: String(x.id), name: decodeEntities(x.name), img: x.picUrl || '',
            author: decodeEntities((x.creator && x.creator.nickname) || ''),
            play: String(x.playCount || ''), count: Number(x.trackCount) || 0
          };
        });
      });
  }

  function txPlaylists(page) {
    var size = 30;
    var payload = {
      comm: { cv: 1602, ct: 20 },
      playlist: {
        module: 'music.playlist.PlaylistSquare',
        method: 'GetRecommendWhole',
        param: { IsReqFeed: true, FeedReq: { From: (page - 1) * size, Size: size } }
      }
    };
    return httpJson('https://u.y.qq.com/cgi-bin/musicu.fcg', {
      method: 'post',
      headers: { 'User-Agent': UA, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      timeout: 20000
    }).then(function (d) {
      var feed = (d.playlist && d.playlist.data && d.playlist.data.FeedRsp &&
        d.playlist.data.FeedRsp.List) || [];
      return feed.map(function (x) {
        var b = (x && x.Playlist && x.Playlist.basic) || {};
        var c = (x && x.Playlist && x.Playlist.content) || {};
        return {
          id: String(b.tid || ''), name: decodeEntities(b.title || ''),
          img: b.cover || b.picurl || c.cover || c.picurl || '',
          author: decodeEntities((b.creator && b.creator.nick) || ''),
          play: String(b.listennum || ''), count: Number(b.songnum) || 0
        };
      }).filter(function (x) { return x.id; });
    });
  }

  // ------------------------------------------------------------------ 歌单详情
  function kwListDetail(id) {
    var url = 'http://nplserver.kuwo.cn/pl.svc?op=getlistinfo&pid=' + encodeURIComponent(id) +
      '&pn=0&rn=100&encode=utf8&keyset=pl2012&identity=kuwo&pcmp4=1' +
      '&vipver=MUSIC_9.0.5.0_W1&newver=1';
    return httpJson(url, { headers: { 'User-Agent': UA, Referer: 'http://www.kuwo.cn/' } })
      .then(function (d) {
        var arr = d.musiclist || [];
        if (!arr.length) throw new Error('歌单为空或已下架');
        return arr.map(kwAnyTrack).filter(Boolean);
      });
  }

  function kgListDetail(id) {
    var url = 'http://mobilecdnbj.kugou.com/api/v3/special/song?specialid=' +
      encodeURIComponent(id) + '&page=1&pagesize=100&version=9108&plat=0&area_code=1';
    return httpJson(url, { headers: { 'User-Agent': UA } }).then(function (d) {
      var arr = (d.data && d.data.info) || [];
      if (!arr.length) throw new Error('歌单为空或已下架');
      return arr.map(kgTrack).filter(Boolean);
    });
  }

  function mgListDetail(id) {
    var url = 'https://app.c.nf.migu.cn/MIGUM3.0/resource/playlist/song/v2.0' +
      '?pageNo=1&pageSize=100&playlistId=' + encodeURIComponent(id);
    return httpJson(url, { headers: MG_HEADERS }).then(function (d) {
      if (d.code !== '000000') throw new Error(d.info || ('咪咕歌单 ' + d.code));
      var arr = (d.data && d.data.songList) || [];
      if (!arr.length) throw new Error('歌单为空或已下架');
      return arr.map(function (x) { return mgTrack(x); }).filter(Boolean);
    });
  }

  function wyListDetail(id) {
    var url = 'https://music.163.com/api/playlist/detail?id=' + encodeURIComponent(id) + '&n=1000';
    return httpJson(url, { headers: { 'User-Agent': UA, Referer: 'https://music.163.com/' } })
      .then(function (d) {
        var arr = (d.result && d.result.tracks) || [];
        if (!arr.length) throw new Error('歌单为空或已下架');
        return arr.map(wySongTrack).filter(Boolean);
      });
  }

  function txListDetail(id) {
    var payload = {
      comm: { cv: 1602, ct: 20 },
      req: {
        module: 'music.srfDissInfo.DissInfo',
        method: 'CgiGetDiss',
        param: { disstid: Number(id), song_begin: 0, song_num: 100, dirid: 0, tag: 1, onlysonglist: 1 }
      }
    };
    return httpJson('https://u.y.qq.com/cgi-bin/musicu.fcg', {
      method: 'post',
      headers: { 'User-Agent': UA, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      timeout: 20000
    }).then(function (d) {
      var arr = (d.req && d.req.data && d.req.data.songlist) || [];
      if (!arr.length) throw new Error('歌单为空或已下架');
      return arr.map(txTrack).filter(Boolean);
    });
  }

  var BOARD_LOADERS = { kw: kwBoard, kg: kgBoard, mg: mgBoard, wy: wyBoard, tx: txBoard };
  var LIST_LOADERS = {
    kw: kwPlaylists, kg: kgPlaylists, mg: mgPlaylists, wy: wyPlaylists, tx: txPlaylists
  };
  var DETAIL_LOADERS = {
    kw: kwListDetail, kg: kgListDetail, mg: mgListDetail, wy: wyListDetail, tx: txListDetail
  };

  var ADAPTERS = {
    kw: { search: kwSearch },
    kg: { search: kgSearch },
    mg: { search: mgSearch },
    wy: { search: wySearch },
    tx: { search: txSearch }
  };

  /* 内置不可用时，用绑定到该平台的自定义音源兜底（音源也可以自带 search） */
  function viaSource(platformId, keyword, opts, errors) {
    var SR = window.LXSources;
    var apiId = SR && typeof SR.forPlatform === 'function' ? SR.forPlatform(platformId) : '';
    if (!apiId) {
      return Promise.resolve({
        tracks: [], provider: 'none', errors: errors, note: errors.length
          ? '平台接口暂不可用，且该平台未配置音源'
          : (ADAPTERS[platformId] ? '' : '该平台需要自定义音源提供搜索（接口需签名）')
      });
    }
    return SR.searchByApi(apiId, keyword, Object.assign({ platform: platformId }, opts)).then(function (r) {
      return {
        tracks: r.tracks, provider: 'source',
        errors: errors.concat(r.errors || []),
        note: errors.length ? '平台接口不可用，已改用该平台绑定的音源' : ''
      };
    });
  }

  function search(platformId, keyword, opts) {
    opts = opts || {};
    var kw = String(keyword || '').trim();
    if (!kw) return Promise.resolve({ tracks: [], provider: 'none', errors: [], note: '' });
    var ad = ADAPTERS[platformId];
    var page = opts.page || 1, limit = opts.limit || 30;
    if (!ad || !ad.search) return viaSource(platformId, kw, opts, []);
    return ad.search(kw, page, limit).then(function (tracks) {
      remember(tracks);
      if (tracks.length) return { tracks: tracks, provider: 'builtin', errors: [], note: '' };
      return viaSource(platformId, kw, opts, []);
    }).catch(function (e) {
      return viaSource(platformId, kw, opts, [String(e && e.message || e)]);
    });
  }

  function boards(platformId) {
    var list = BOARD_CATALOG[platformId] || [];
    return list.map(function (b) {
      return { id: platformId + ':' + b.id, name: b.name, bangid: b.id };
    });
  }

  function viaSourceBoard(platformId, bangid, opts, err) {
    var SR = window.LXSources;
    var apiId = SR && typeof SR.forPlatform === 'function' ? SR.forPlatform(platformId) : '';
    if (!apiId) {
      return {
        tracks: [], provider: 'none', errors: err ? [err] : [],
        note: '平台榜单接口不可用，且该平台未配置音源'
      };
    }
    return SR.leaderboardByApi(apiId, bangid, Object.assign({ platform: platformId }, opts))
      .then(function (r) {
        return {
          tracks: r.tracks || [], provider: 'source', errors: r.errors || [],
          note: r.tracks && r.tracks.length
            ? '平台榜单不可用，已改用该平台的音源'
            : '平台榜单不可用，音源也没有返回曲目'
        };
      });
  }

  function board(platformId, boardId, opts) {
    opts = opts || {};
    var bangid = String(boardId || '').split(':').pop();
    var fn = BOARD_LOADERS[platformId];
    if (!fn) {
      return Promise.resolve({
        tracks: [], provider: 'none', errors: [],
        note: '该平台暂无内置榜单'
      });
    }
    return fn(bangid, opts.page || 1, opts.limit || 100).then(function (tracks) {
      if (!tracks.length) throw new Error('榜单没有返回曲目');
      remember(tracks);
      return { tracks: tracks, provider: 'builtin', errors: [], note: '' };
    }).catch(function (e) {
      return Promise.resolve(viaSourceBoard(platformId, bangid, opts, String(e && e.message || e)));
    });
  }

  /* 推荐歌单：每个平台都有官方歌单广场，返回统一的卡片结构 */
  function recommendLists(platformId, page) {
    var fn = LIST_LOADERS[platformId];
    if (!fn) return Promise.resolve({ lists: [], note: '该平台暂不支持在线歌单' });
    return fn(page || 1).then(function (lists) {
      return { lists: lists || [], note: lists && lists.length ? '' : '该平台没有返回歌单' };
    });
  }

  /* 歌单详情：曲目同样进 external 池，才能被 D.byId 找到并播放 */
  function listDetail(platformId, listId) {
    var fn = DETAIL_LOADERS[platformId];
    if (!fn) return Promise.resolve({ tracks: [], note: '该平台暂不支持在线歌单' });
    return fn(listId).then(function (tracks) {
      remember(tracks);
      return { tracks: tracks || [], note: '' };
    });
  }

  window.LXPlatform = {
    LIST: PLATFORMS,
    byId: byId,
    nameOf: nameOf,
    hasBuiltinSearch: function (id) { return !!(ADAPTERS[id] && ADAPTERS[id].search); },
    hasBuiltinBoard: function (id) { return !!BOARD_LOADERS[id]; },
    hasPlaylists: function (id) { return !!LIST_LOADERS[id]; },
    boards: boards,
    board: board,
    recommendLists: recommendLists,
    listDetail: listDetail,
    search: search,
    http: http,
    httpJson: httpJson,
    fmt: fmt,
    decodeEntities: decodeEntities
  };
})();

</script>
<script>/* ===== quality.js ===== */
/* 音质管理（对齐 XCQ0607/lxserver 的 public/music/js/player/quality.js）
 *
 * 职责：
 *  - 定义音质优先级（最高 master 母带）与中文显示名；
 *  - 从曲目/平台接口给出的 qualitys 判断哪些档位「已声明可用」；
 *  - 提供下载/播放的音质选择、以及解析失败时的逐级降级链。
 *
 * 说明：平台的公开检索接口通常只声明到 flac/flac24bit/hires，
 * 更高的 master/atmos 等档位是否真有资源取决于你导入的音源脚本，
 * 因此界面把「未声明」的档位也列出来（标注待验证），允许用户主动尝试。
 */
(function () {
  'use strict';

  /* 从高到低 */
  var PRIORITY = ['master', 'atmos_plus', 'atmos', 'hires', 'flac24bit', 'flac', '320k', '192k', '128k'];
  var ORDER = PRIORITY.slice().reverse();

  var NAMES = {
    master: '母带音质',
    atmos_plus: '增强空间音频',
    atmos: '空间音频',
    hires: '高解析度',
    flac24bit: '24bit 无损',
    flac: '无损音质',
    '320k': '高音质',
    '192k': '192k 音质',
    '128k': '标准音质'
  };

  var SHORT = {
    master: '母带', atmos_plus: '增强空间', atmos: '空间音频', hires: '高解析',
    flac24bit: '24bit', flac: '无损', '320k': '320k', '192k': '192k', '128k': '128k'
  };

  var DESC = {
    master: '最高品质，通常为 24bit/96kHz 以上，体积很大',
    atmos_plus: '增强空间音频，需要音源支持',
    atmos: '空间音频，需要音源支持',
    hires: '高解析度，通常 24bit',
    flac24bit: '24bit 无损压缩',
    flac: '无损压缩，约 30–40MB/首',
    '320k': '接近无损的有损压缩',
    '192k': '中等码率',
    '128k': '体积最小，适合试听'
  };

  /* 各平台「可以选择」的音质（与 lxserver quality.js 保持一致） */
  var PLATFORM = {
    tx: ['128k', '320k', 'flac', 'flac24bit', 'hires', 'atmos', 'atmos_plus', 'master'],
    wy: ['128k', '320k', 'flac', 'flac24bit', 'hires', 'atmos', 'master'],
    kw: ['128k', '320k', 'flac', 'flac24bit', 'hires'],
    kg: ['128k', '320k', 'flac', 'flac24bit', 'hires'],
    mg: ['128k', '320k', 'flac']
  };

  /* 旧版本留下的三档（standard/high/lossless）映射到标准 key */
  var LEGACY = { standard: '128k', high: '320k', lossless: 'flac' };

  function normalize(q) {
    if (!q) return '';
    var s = String(q).trim();
    return LEGACY[s] || s;
  }

  /* 曲目自身声明的音质：平台接口的 qualitys / 音源返回的 qualitys 或 types */
  /* 该曲目「绑定的音源」声明的档位。
   * 平台公开接口通常只到 flac24bit/hires，而用户导入的音源可能提供母带/空间音频，
   * 例如 sources.wy.qualitys = [...,'master']。这些档位要算作可用，否则菜单会误标灰。 */
  function sourceQualitys(track) {
    var SR = window.LXSources;
    if (!SR || typeof SR.trackSource !== 'function') return [];
    var a = null;
    try { a = SR.trackSource(track); } catch (e) { return []; }
    if (!a || !a.sources) return [];
    var decl = track && track.platform && a.sources[track.platform];
    if (!decl) return [];
    var list = decl.qualitys || decl.qualities || [];
    if (!Array.isArray(list)) list = Object.keys(list || {});
    var out = [];
    list.forEach(function (x) {
      var q = normalize(typeof x === 'string' ? x : (x && (x.type || x.quality)));
      if (q && PRIORITY.indexOf(q) >= 0 && out.indexOf(q) < 0) out.push(q);
    });
    return out;
  }

  function fromTrack(track) {
    if (!track) return [];
    var raw = track.qualitys || track.types ||
      (track._raw && (track._raw.qualitys || track._raw.types)) || [];
    if (!Array.isArray(raw)) raw = Object.keys(raw || {});
    var out = [];
    raw.forEach(function (x) {
      var q = normalize(typeof x === 'string' ? x : (x && (x.type || x.quality)));
      if (q && PRIORITY.indexOf(q) >= 0 && out.indexOf(q) < 0) out.push(q);
    });
    // 音源声明的档位并入（平台没声明但音源能给的，也算可用）
    sourceQualitys(track).forEach(function (q) { if (out.indexOf(q) < 0) out.push(q); });
    return out;
  }

  /* 平台可选项（由曲目的 platform 决定） */
  function platformList(track) {
    var pid = track && (track.platform || (track._raw && track._raw.source));
    return PLATFORM[pid] ? PLATFORM[pid].slice() : [];
  }

  /* 界面用：列出全部档位（高→低），标注该曲目是否声明可用 */
  function selectable(track) {
    var avail = fromTrack(track);
    var pf = platformList(track);
    return PRIORITY.map(function (q) {
      var declared = avail.indexOf(q) >= 0;
      var onPlatform = pf.length ? pf.indexOf(q) >= 0 : true;
      return {
        q: q,
        name: NAMES[q],
        short: SHORT[q],
        desc: DESC[q],
        declared: declared,          // 平台/音源明确说这首有该档
        onPlatform: onPlatform,      // 该平台是否在可选清单里
        available: declared || (!avail.length && onPlatform)
      };
    });
  }

  /* 单曲最佳档位：从偏好往下找第一个声明可用的 */
  function best(track, pref) {
    var avail = fromTrack(track);
    var start = PRIORITY.indexOf(normalize(pref) || '320k');
    if (start < 0) start = PRIORITY.indexOf('320k');
    if (!avail.length) return normalize(pref) || '320k';
    for (var i = start; i < PRIORITY.length; i++) {
      if (avail.indexOf(PRIORITY[i]) >= 0) return PRIORITY[i];

      return ORDER.indexOf(a) - ORDER.indexOf(b);

  function downgradeChain(q, track, max) {

      if (i > from && avail.length && avail.indexOf(cur) < 0) continue;
      out.push(cur);
      if (max && out.length >= max) break;
    }
    return out.length ? out : [normalize(q) || '128k'];
  }

  function lower(q, track) {
    var chain = downgradeChain(q, track, 0);
    return chain.length > 1 ? chain[1] : null;
  }

  function short(q) { return SHORT[normalize(q)] || String(q || '').toUpperCase(); }
  function desc(q) { return DESC[normalize(q)] || ''; }

  var NAME_ONLY = { master: 1, atmos_plus: 1, atmos: 1, hires: 1 };

    var k = normalize(q);
    return name(k) + (NAME_ONLY[k] ? '' : ' · ' + k.toUpperCase());
  }
  function isLossless(q) {

  }

  window.LXQuality = {
    PRIORITY: PRIORITY, ORDER: ORDER, NAMES: NAMES, SHORT: SHORT, DESC: DESC,
    PLATFORM: PLATFORM, LEGACY: LEGACY,
    normalize: normalize, fromTrack: fromTrack, platformList: platformList,
    sourceQualitys: sourceQualitys,
    selectable: selectable, best: best, downgradeChain: downgradeChain, lower: lower,
    name: name, short: short, desc: desc, label: label, isLossless: isLossless
  };
})();

<script>/* ===== lyrics.js ===== */
/* 歌词解析与滚动（v3.7.0）
 * 对齐 lxserver web 播放器 public/music/js/lyrics/lyric-parser.js 的解析口径：
 * - 时间标签 [mm:ss]、[mm:ss.xx]、[mm:ss:xx]、[hh:mm:ss.xx]，一行可带多个标签
 * - [offset:±ms] 偏移（正值表示歌词提前）
 * - 同一时间戳的第二段文本视为翻译行（官方用 extendedLyrics，这里合并进 trans）
 * - 去掉逐字标签 <mm:ss.xx>
 * 只负责解析、渲染与高亮，不做网络请求（歌词文本由 LXSources.lyric 提供）。
 */
(function () {
  'use strict';

  var TIME_TAG = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  var WORD_TAG = /<\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?>/g;
  var cache = {};
  var lastIdx = -1, lastTrack = '';

  function toSeconds(mm, ss, frac) {
    var f = frac == null ? 0 : Number('0.' + String(frac));
    return (Number(mm) || 0) * 60 + (Number(ss) || 0) + (isFinite(f) ? f : 0);
  }

  function parse(text) {
    var src = String(text == null ? '' : text).replace(/\r\n?/g, '\n');
    var offset = 0;
    var mOff = src.match(/\[offset:\s*([+-]?\d+)\s*\]/i);
    if (mOff) offset = Number(mOff[1]) || 0;

    var lines = [], index = {}, plain = [];
    src.split('\n').forEach(function (raw) {
      var line = raw.replace(WORD_TAG, '').trim();
      if (!line) return;
      var stamps = [], m;
      TIME_TAG.lastIndex = 0;
      while ((m = TIME_TAG.exec(line))) {
        stamps.push(toSeconds(m[1], m[2], m[3]));
      }
      var content = line.replace(TIME_TAG, '').trim();
      if (!stamps.length) {
        // 没有时间轴：当作纯文本歌词（有些音源只给整段文本）
        if (content && !/^\[[a-z]+:/i.test(content)) plain.push(content);
        return;
      }
      if (!content) return;
      stamps.forEach(function (t) {
        var key = t.toFixed(2);
        if (index[key]) {
          // 同一时间戳的第二行通常是翻译
          if (!index[key].trans) index[key].trans = content;
          return;
        }
        var item = { t: Math.max(0, t - offset / 1000), text: content, trans: '' };
        index[key] = item;
        lines.push(item);
      });
    });

    lines.sort(function (a, b) { return a.t - b.t; });
    return { lines: lines, plain: plain, offset: offset, hasTime: lines.length > 0 };
  }

  function mergeTranslation(parsed, transParsed) {
    if (!parsed || !transParsed || !transParsed.lines.length) return parsed;
    var byTime = {};
    transParsed.lines.forEach(function (l) { byTime[l.t.toFixed(2)] = l.text; });
    parsed.lines.forEach(function (l) {
      if (!l.trans) {
        var v = byTime[l.t.toFixed(2)];
        if (v) l.trans = v;
      }
    });
    return parsed;
  }

  /* 当前应高亮的行：最后一个 t <= time 的行；还没到第一行返回 -1 */
  function indexAt(lines, time) {
    if (!lines || !lines.length) return -1;
    var lo = 0, hi = lines.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (lines[mid].t <= time + 0.02) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* 渲染到容器。有时间的行可点击跳转，纯文本只做展示 */
  function render(container, parsed, trackId) {
    if (!container) return;
    lastIdx = -1;
    lastTrack = trackId || '';
    if (!parsed || (!parsed.lines.length && !parsed.plain.length)) {
      container.innerHTML = '<p class="lc-empty">暂无歌词（音源脚本实现 lyric 动作后可显示）</p>';
      return;
    }
    if (!parsed.hasTime) {
      container.innerHTML = '<div class="lc-plain">' + parsed.plain.map(function (l) {
        return '<p>' + esc(l) + '</p>';
      }).join('') + '</div>';
      return;
    }
    container.innerHTML = parsed.lines.map(function (l, i) {
      return '<p class="lc-line' + (i === 0 ? ' on' : '') + '" data-act="lyric-seek" data-t="' +
        l.t.toFixed(2) + '"><span class="lc-main">' + esc(l.text) + '</span>' +
        (l.trans ? '<span class="lc-sub">' + esc(l.trans) + '</span>' : '') + '</p>';
    }).join('');
  }

  /* 按播放时间同步高亮与滚动；返回当前行号 */
  function sync(container, parsed, time) {
    if (!container || !parsed || !parsed.hasTime) return -1;
    var idx = indexAt(parsed.lines, time);
    if (idx === lastIdx) return idx;
    var ps = container.querySelectorAll('.lc-line');
    if (!ps.length) return idx;
    for (var i = 0; i < ps.length; i++) ps[i].classList.toggle('on', i === idx);
    lastIdx = idx;
    var cur = ps[idx];
    if (cur) {
      var top = cur.offsetTop - container.clientHeight / 2 + cur.offsetHeight / 2;
      try { container.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }
      catch (e) { container.scrollTop = Math.max(0, top); }
    }
    return idx;
  }

  /* 歌词文本获取（带缓存）。音源不给歌词时返回 null，不抛错。 */
  function load(track) {
    if (!track || !track.id) return Promise.resolve(null);
    if (cache[track.id]) return Promise.resolve(cache[track.id]);
    var SR = window.LXSources;
    if (!SR || typeof SR.lyric !== 'function') return Promise.resolve(null);
    return SR.lyric(track).then(function (res) {
      if (!res || !res.lyric) return null;
      var parsed = parse(res.lyric);
      if (res.tlyric) mergeTranslation(parsed, parse(res.tlyric));
      if (!parsed.lines.length && !parsed.plain.length) return null;
      cache[track.id] = parsed;
      return parsed;
    }).catch(function () { return null; });
  }

  function clear(id) {
    if (id) delete cache[id];
    else cache = {};
  }

  window.LXLyr = {
    parse: parse,
    indexAt: indexAt,
    render: render,
    sync: sync,
    load: load,
    clear: clear,
    hasTime: function (parsed) { return !!(parsed && parsed.hasTime); }
  };
})();

</script>

  /* v3.2.0 迁移：清掉内置演示曲目（id 形如 kw_0…kw_47）留在队列与 IndexedDB 里的任务。
